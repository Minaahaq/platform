<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1020" />
    <title>MINA CODE ACADEMY — منصة التعلم</title>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js">
    </script>

    <style>
        /* ── Reset & Variables ── */
        :root {
            --bg: #080b14;
            --panel: #101625;
            --panel2: #151d2f;
            --text: #f5f7ff;
            --muted: #9ba7bf;
            --line: #24304a;
            --primary: #7c5cff;
            --primary2: #00d4ff;
            --success: #26d07c;
            --danger: #ff5d73;
            --warn: #ffbf47;
            --shadow: 0 18px 55px #0007;
        }
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            background: radial-gradient(circle at 80% 0, #19234a 0, transparent 32%), var(--bg);
            color: var(--text);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            transition: background 0.3s;
            min-height: 100vh;
        }
        button,
        input,
        textarea,
        select {
            font: inherit;
        }
        button {
            cursor: pointer;
            border: 0;
        }
        .app {
            min-height: 100vh;
        }

        /* ── Topbar ── */
        .topbar {
            height: 72px;
            position: sticky;
            top: 0;
            z-index: 30;
            background: #0b1020d9;
            backdrop-filter: blur(18px);
            border-bottom: 1px solid var(--line);
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 0 18px;
        }
        .brand {
            font-weight: 900;
            letter-spacing: 0.4px;
            white-space: nowrap;
        }
        .brand b {
            color: #9c86ff;
        }
        .brand small {
            display: block;
            color: var(--muted);
            font-size: 10px;
            letter-spacing: 2px;
        }
        .menu {
            display: none;
            background: var(--panel);
            color: var(--text);
            padding: 10px;
            border-radius: 12px;
        }
        .search {
            flex: 1;
            max-width: 520px;
            margin: auto;
            position: relative;
        }
        .search input {
            width: 100%;
            background: var(--panel);
            border: 1px solid var(--line);
            color: var(--text);
            padding: 11px 42px 11px 14px;
            border-radius: 14px;
            outline: none;
        }
        .search span {
            position: absolute;
            right: 14px;
            top: 10px;
            color: var(--muted);
        }
        .actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .iconbtn,
        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: var(--panel);
            color: var(--text);
            border: 1px solid var(--line);
            display: grid;
            place-items: center;
            font-weight: 700;
        }
        .avatar {
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--primary2));
            border: 0;
            color: #fff;
        }

        /* ── Sidebar ── */
        .shell {
            display: flex;
        }
        .sidebar {
            width: 240px;
            position: fixed;
            top: 72px;
            bottom: 0;
            padding: 18px 14px;
            background: #0b1020ee;
            border-left: 1px solid var(--line);
            overflow: auto;
            z-index: 20;
            transition: transform 0.25s ease;
        }
        .navtitle {
            font-size: 11px;
            color: #65728d;
            margin: 14px 10px 8px;
        }
        .navbtn {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--muted);
            background: transparent;
            padding: 12px;
            border-radius: 12px;
            text-align: right;
            margin: 3px 0;
            border: 0;
            font-size: 14px;
        }
        .navbtn:hover,
        .navbtn.active {
            background: linear-gradient(90deg, #7c5cff22, transparent);
            color: #fff;
        }

        /* ── Main ── */
        .main {
            margin-right: 240px;
            width: calc(100% - 240px);
            padding: 26px;
            max-width: 1500px;
            margin-left: auto;
        }
        .page {
            animation: fade 0.3s ease;
        }
        @keyframes fade {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: none;
            }
        }

        /* ── Hero ── */
        .hero {
            padding: 28px;
            border: 1px solid var(--line);
            border-radius: 24px;
            background: linear-gradient(135deg, #151c32, #0e1424);
            box-shadow: var(--shadow);
            display: flex;
            justify-content: space-between;
            gap: 20px;
            overflow: hidden;
            position: relative;
        }
        .hero:after {
            content: "";
            position: absolute;
            width: 260px;
            height: 260px;
            border-radius: 50%;
            background: #7c5cff33;
            filter: blur(35px);
            left: -100px;
            top: -120px;
        }
        .eyebrow {
            color: #a995ff;
            font-size: 13px;
            font-weight: 700;
        }
        .hero h1 {
            font-size: clamp(25px, 4vw, 42px);
            margin: 8px 0;
        }
        .hero p {
            color: var(--muted);
            margin: 0 0 20px;
        }
        .hero-stat {
            min-width: 210px;
            align-self: center;
            position: relative;
            z-index: 1;
        }
        .btn {
            padding: 11px 16px;
            border-radius: 12px;
            color: #fff;
            background: linear-gradient(135deg, var(--primary), #5b8cff);
            font-weight: 800;
            border: 0;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn.secondary {
            background: var(--panel2);
            border: 1px solid var(--line);
        }
        .btn.success {
            background: var(--success);
            color: #06150d;
        }

        /* ── Progress ── */
        .progress {
            height: 9px;
            background: #252f47;
            border-radius: 99px;
            overflow: hidden;
        }
        .progress i {
            display: block;
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--primary2));
            border-radius: inherit;
            transition: width 0.7s;
        }

        /* ── Grid / Cards ── */
        .grid {
            display: grid;
            gap: 16px;
        }
        .stats {
            grid-template-columns: repeat(5, minmax(130px, 1fr));
            margin: 20px 0;
        }
        .card {
            background: linear-gradient(145deg, #121a2b, #0e1422);
            border: 1px solid var(--line);
            border-radius: 18px;
            padding: 18px;
            box-shadow: 0 10px 35px #0003;
        }
        .stat .label {
            color: var(--muted);
            font-size: 12px;
        }
        .stat .value {
            font-size: 25px;
            font-weight: 900;
            margin-top: 7px;
        }
        .section {
            margin-top: 26px;
        }
        .sectionhead {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 13px;
        }
        .section h2 {
            font-size: 19px;
            margin: 0;
        }
        .muted {
            color: var(--muted);
        }

        /* ── Courses ── */
        .course-grid {
            grid-template-columns: repeat(3, 1fr);
        }
        .course .courseicon {
            width: 50px;
            height: 50px;
            border-radius: 15px;
            display: grid;
            place-items: center;
            background: #7c5cff22;
            font-size: 25px;
        }
        .course h3 {
            margin: 14px 0 6px;
        }
        .course p {
            font-size: 13px;
            line-height: 1.7;
            color: var(--muted);
            min-height: 42px;
        }
        .tags {
            display: flex;
            gap: 7px;
            flex-wrap: wrap;
            margin: 12px 0;
        }
        .tag {
            font-size: 11px;
            padding: 5px 8px;
            border-radius: 8px;
            background: #ffffff08;
            color: var(--muted);
            border: 1px solid var(--line);
        }

        /* ── Lessons / Tasks ── */
        .list {
            display: grid;
            gap: 10px;
        }
        .lessonrow,
        .taskrow {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px;
            background: #0c1322;
            border: 1px solid var(--line);
            border-radius: 13px;
            cursor: default;
        }
        .lessonnum {
            width: 34px;
            height: 34px;
            display: grid;
            place-items: center;
            border-radius: 10px;
            background: #ffffff08;
            color: #b8c3da;
        }
        .lessonrow.done .lessonnum {
            background: #26d07c22;
            color: var(--success);
        }
        .lessonrow.current {
            border-color: #7c5cff88;
        }
        .grow {
            flex: 1;
        }
        .pill {
            font-size: 11px;
            padding: 5px 9px;
            border-radius: 99px;
            background: #ffffff09;
            color: var(--muted);
            white-space: nowrap;
        }
        .pill.success {
            color: var(--success);
            background: #26d07c18;
        }
        .pill.warn {
            color: var(--warn);
            background: #ffbf4718;
        }

        /* ── Lesson layout ── */
        .lesson-layout {
            display: grid;
            grid-template-columns: 270px 1fr;
            gap: 16px;
        }
        .lesson-side {
            height: max-content;
            position: sticky;
            top: 90px;
        }
        .video-container {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            margin: 15px 0;
            border-radius: 18px;
            overflow: hidden;
            background: #0b1220;
            border: 1px solid var(--line);
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
        .video-placeholder {
            height: 200px;
            display: grid;
            place-items: center;
            background: #0b1220;
            border-radius: 18px;
            border: 1px solid var(--line);
            color: var(--muted);
        }

        /* ── Code ── */
        .code {
            direction: ltr;
            text-align: left;
            background: #080c15;
            border: 1px solid #29344d;
            border-radius: 14px;
            overflow: auto;
            margin: 12px 0;
        }
        .codehead {
            padding: 8px 12px;
            color: #8491ac;
            background: #0d1422;
            border-bottom: 1px solid var(--line);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .code pre {
            margin: 0;
            padding: 16px;
            color: #d9e3ff;
            font: 14px/1.7 "SFMono-Regular", Consolas, monospace;
            white-space: pre-wrap;
            word-break: break-all;
        }

        /* ── Editor ── */
        .editor {
            direction: ltr;
            text-align: left;
            width: 100%;
            min-height: 200px;
            resize: vertical;
            background: #070b13;
            color: #dce5ff;
            border: 1px solid #2a3650;
            border-radius: 14px;
            padding: 16px;
            font: 14px/1.7 monospace;
            outline: none;
        }
        .output {
            direction: ltr;
            text-align: left;
            background: #070b13;
            border: 1px solid var(--line);
            border-radius: 14px;
            min-height: 80px;
            padding: 14px;
            white-space: pre-wrap;
            color: #8ff0b7;
            font: 14px/1.7 monospace;
        }

        /* ── Toast ── */
        .toastwrap {
            position: fixed;
            left: 18px;
            bottom: 18px;
            z-index: 100;
            display: grid;
            gap: 8px;
        }
        .toast {
            padding: 12px 15px;
            background: #151d2d;
            border: 1px solid var(--line);
            border-radius: 12px;
            box-shadow: var(--shadow);
            animation: slide 0.3s ease;
        }
        @keyframes slide {
            from {
                transform: translateX(-20px);
                opacity: 0;
            }
            to {
                transform: none;
                opacity: 1;
            }
        }

        /* ── Modal ── */
        .modal {
            position: fixed;
            inset: 0;
            background: #0009;
            backdrop-filter: blur(5px);
            z-index: 80;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 18px;
        }
        .modal.show {
            display: flex;
        }
        .modalbox {
            width: min(720px, 100%);
            max-height: 90vh;
            overflow: auto;
            background: #101827;
            border: 1px solid var(--line);
            border-radius: 20px;
            padding: 20px;
        }
        .close {
            float: left;
            background: transparent;
            color: #fff;
            font-size: 28px;
            border: 0;
            line-height: 1;
        }

        /* ── Bottom nav ── */
        .bottomnav {
            display: none;
        }

        /* ── Empty / Locked ── */
        .empty {
            text-align: center;
            padding: 40px;
            color: var(--muted);
        }
        .locked {
            opacity: 0.55;
        }
        .badgegrid {
            grid-template-columns: repeat(3, 1fr);
        }
        .badge {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .badgeicon {
            font-size: 32px;
            width: 55px;
            height: 55px;
            display: grid;
            place-items: center;
            background: #ffffff08;
            border-radius: 15px;
        }

        /* ── Loader ── */
        #loader {
            position: fixed;
            inset: 0;
            z-index: 999;
            background: #080b14;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            transition: opacity 0.5s ease;
        }
        #loader.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid var(--line);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ── Responsive ── */
        @media (max-width: 1050px) {
            .stats {
                grid-template-columns: repeat(3, 1fr);
            }
            .course-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        @media (max-width: 760px) {
            .topbar {
                height: 64px;
                padding: 0 10px;
            }
            .menu {
                display: block;
            }
            .sidebar {
                display: none;
            }
            .sidebar.open {
                display: block;
                transform: translateX(0);
            }
            .main {
                margin: 0;
                width: 100%;
                padding: 14px 12px 82px;
            }
            .brand {
                font-size: 13px;
            }
            .search {
                display: none;
            }
            .hero {
                display: block;
                padding: 20px;
            }
            .hero-stat {
                margin-top: 20px;
            }
            .stats {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }
            .stat:last-child {
                grid-column: span 2;
            }
            .course-grid,
            .badgegrid {
                grid-template-columns: 1fr;
            }
            .lesson-layout {
                grid-template-columns: 1fr;
            }
            .lesson-side {
                position: static;
            }
            .bottomnav {
                position: fixed;
                display: flex;
                bottom: 0;
                right: 0;
                left: 0;
                height: 65px;
                background: #0b1020ed;
                backdrop-filter: blur(15px);
                border-top: 1px solid var(--line);
                z-index: 40;
                justify-content: space-around;
            }
            .bottomnav button {
                background: transparent;
                color: var(--muted);
                font-size: 10px;
                padding: 7px;
                border: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 2px;
            }
            .bottomnav button b {
                font-size: 18px;
            }
            .hero h1 {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>

    <!-- Loader -->
    <div id="loader">
        <div class="spinner"></div>
        <p>🔄 جاري تحميل المنصة...</p>
    </div>

    <!-- App -->
    <div id="app"></div>

    <!-- Toast -->
    <div class="toastwrap" id="toastwrap"></div>

    <!-- Modal -->
    <div class="modal" id="modal">
        <div class="modalbox">
            <button class="close" onclick="closeModal()">×</button>
            <div id="modalcontent"></div>
        </div>
    </div>

    <script>
        /* ═══════════════════════════════════════════════════
           FIREBASE CONFIG (نفس إعدادات لوحة التحكم)
           ═══════════════════════════════════════════════════ */
        const firebaseConfig = {
            apiKey: "AIzaSyB0p0us6BuzD2ngzjhRnmUIhlOcBeRp0vQ",
            authDomain: "tok-tak-d6e17.firebaseapp.com",
            databaseURL: "https://tok-tak-d6e17-default-rtdb.firebaseio.com",
            projectId: "tok-tak-d6e17",
            storageBucket: "tok-tak-d6e17.appspot.com",
            messagingSenderId: "547062578826",
            appId: "1:547062578826:web:aa285cf798341be07cb773",
            measurementId: "G-7EMKEQKPVV"
        };

        /* ═══════════════════════════════════════════════════
           STATE
           ═══════════════════════════════════════════════════ */
        const CONFIG = { xp: { lesson: 10, task: 30, quiz: 20 } };

        let currentUser = null;
        let userProgressRef = null;
        let contentRef = null;

        // بيانات المنصة القادمة من Firebase
        let platformContent = {
            lessons: [], // { id, title, difficulty, duration, videoUrl, code }
            tasks: [], // { id, title, difficulty, xp, desc, starter }
            quizzes: [] // { id, title, questions }
        };

        // تقدم المستخدم الحالي
        let progress = {
            studentName: 'طالب',
            xp: 0,
            level: 1,
            completedLessons: [],
            completedTasks: [],
            quizResults: {},
            badges: []
        };

        let _initialLoad = false;

        /* ═══════════════════════════════════════════════════
           UTILITIES
           ═══════════════════════════════════════════════════ */
        const $ = id => document.getElementById(id);
        const $$ = sel => [...document.querySelectorAll(sel)];

        function esc(str) {
            return String(str ?? '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;',
                "'": '&#039;' } [m]));
        }

        function toast(msg) {
            const wrap = $('toastwrap');
            const el = document.createElement('div');
            el.className = 'toast';
            el.textContent = msg;
            wrap.appendChild(el);
            setTimeout(() => el.remove(), 2800);
        }

        function pct() {
            const total = platformContent.lessons.length || 1;
            return Math.round((progress.completedLessons.length / total) * 100);
        }

        function levelName() {
            const lvl = progress.level || 1;
            return ['', 'Beginner', 'Coder', 'Problem Solver', 'Developer', 'Code Master'][lvl] || 'Code Master';
        }

        function statusLesson(id) {
            if (progress.completedLessons.includes(id)) return 'done';
            // current = أول درس غير مكتمل (ترتيب تصاعدي)
            const sorted = platformContent.lessons.map(l => l.id).sort((a, b) => a - b);
            const next = sorted.find(lid => !progress.completedLessons.includes(lid));
            if (id === next) return 'current';
            return 'locked';
        }

        function nav(route) {
            location.hash = route;
            render();
        }

        function closeModal() {
            $('modal').classList.remove('show');
        }

        function openModal(html) {
            $('modalcontent').innerHTML = html;
            $('modal').classList.add('show');
        }

        function copyCode(code) {
            navigator.clipboard?.writeText(code).then(() => toast('✓ تم نسخ الكود')).catch(() => toast('انسخ الكود يدويًا'));
        }

        function addXP(amount) {
            progress.xp += amount;
            progress.level = Math.min(5, Math.floor(progress.xp / 300) + 1);
            saveProgress();
            toast(`🎉 حصلت على ${amount} XP`);
        }

        /* ═══════════════════════════════════════════════════
           FIREBASE INIT
           ═══════════════════════════════════════════════════ */
        let firebaseReady = false;

        function initFirebase() {
            try {
                firebase.initializeApp(firebaseConfig);
                firebaseReady = true;
                return true;
            } catch (e) {
                console.warn('Firebase init error:', e);
                return false;
            }
        }

        /* ═══════════════════════════════════════════════════
           AUTH & DATA LISTENERS
           ═══════════════════════════════════════════════════ */
        function signInAnonymously() {
            if (!firebaseReady) {
                fallbackLocal();
                return;
            }
            firebase.auth().signInAnonymously()
                .then(cred => {
                    currentUser = cred.user;
                    // مرجع تقدم المستخدم
                    userProgressRef = firebase.database().ref('users/' + currentUser.uid + '/progress');
                    // مرجع المحتوى العام (الذي تديره لوحة التحكم)
                    contentRef = firebase.database().ref('content');

                    // استماع لتقدم المستخدم
                    userProgressRef.on('value', snap => {
                        const data = snap.val();
                        if (data) {
                            progress = { ...progress, ...data };
                        } else {
                            // إنشاء تقدم جديد للمستخدم
                            const initProgress = {
                                studentName: 'طالب',
                                xp: 0,
                                level: 1,
                                completedLessons: [],
                                completedTasks: [],
                                quizResults: {},
                                badges: []
                            };
                            userProgressRef.set(initProgress);
                            progress = initProgress;
                        }
                        if (_initialLoad) render();
                    });

                    // استماع للمحتوى (من لوحة التحكم)
                    contentRef.on('value', snap => {
                        const data = snap.val();
                        if (data) {
                            platformContent.lessons = data.lessons || [];
                            platformContent.tasks = data.tasks || [];
                            platformContent.quizzes = data.quizzes || [];
                        } else {
                            // إذا كان فارغاً، نضع مصفوفات فارغة
                            platformContent.lessons = [];
                            platformContent.tasks = [];
                            platformContent.quizzes = [];
                            // إنشاء هيكل فارغ في Firebase ليتمكن المسؤول من الإضافة
                            contentRef.set({ lessons: [], tasks: [], quizzes: [] });
                        }
                        if (_initialLoad) {
                            hideLoader();
                            render();
                        }
                        _initialLoad = true;
                    });

                })
                .catch(err => {
                    console.warn('Auth error:', err);
                    fallbackLocal();
                });
        }

        function fallbackLocal() {
            toast('⚠️ وضع غير متصل — بيانات تجريبية');
            // بيانات تجريبية بسيطة لتعمل بدون اتصال
            platformContent = {
                lessons: [
                    { id: 1, title: 'مقدمة في البرمجة', difficulty: 'Easy', duration: 12, videoUrl: '',
                        code: 'console.log("Hello")' },
                    { id: 2, title: 'المتغيرات', difficulty: 'Easy', duration: 15, videoUrl: '',
                    code: 'let x = 5;' }
                ],
                tasks: [
                    { id: 1, title: 'اجمع رقمين', difficulty: 'Easy', xp: 30, desc: 'اكتب دالة تجمع رقمين',
                        starter: 'function add(a,b) { return a+b; }' }
                ],
                quizzes: [
                    { id: 1, title: 'اختبار أساسيات', questions: 5 }
                ]
            };
            progress = {
                studentName: 'طالب',
                xp: 0,
                level: 1,
                completedLessons: [],
                completedTasks: [],
                quizResults: {},
                badges: []
            };
            _initialLoad = true;
            hideLoader();
            render();
        }

        function saveProgress() {
            if (!userProgressRef) return;
            userProgressRef.update(progress).catch(err => console.warn(err));
        }

        function hideLoader() {
            const el = $('loader');
            if (el) el.classList.add('hidden');
        }

        /* ═══════════════════════════════════════════════════
           ROUTER & RENDER
           ═══════════════════════════════════════════════════ */
        function route() {
            return location.hash.slice(1) || 'dashboard';
        }

        function render() {
            if (!_initialLoad) return;
            const r = route(),
                parts = r.split('/'),
                view = parts[0];
            let content;
            switch (view) {
                case 'dashboard':
                    content = renderDashboard();
                    break;
                case 'courses':
                    content = renderCourses();
                    break;
                case 'course':
                    content = renderCourse(+parts[1] || 1);
                    break;
                case 'lesson':
                    content = renderLesson(+parts[1] || 1);
                    break;
                case 'tasks':
                    content = renderTasks();
                    break;
                case 'task':
                    content = renderTask(+parts[1] || 1);
                    break;
                case 'quiz':
                    content = renderQuiz(+parts[1] || 1);
                    break;
                case 'code-lab':
                    content = renderCodeLab();
                    break;
                case 'achievements':
                    content = renderAchievements();
                    break;
                case 'profile':
                    content = renderProfile();
                    break;
                default:
                    content = renderDashboard();
            }
            $('app').innerHTML = layout(content, view);
            bindGlobal();
        }

        function layout(content, view) {
            return `<div class="app">
            <header class="topbar">
              <button class="menu" onclick="toggleDrawer()">☰</button>
              <div class="brand"><b>&lt;/&gt; MINA CODE</b><small>ACADEMY</small></div>
              <div class="search"><span>⌕</span><input id="search" placeholder="ابحث..." autocomplete="off" /></div>
              <div class="actions">
                <button class="iconbtn" onclick="toast('🔔 لا توجد إشعارات جديدة')">🔔</button>
                <button class="avatar" onclick="nav('profile')">${esc(progress.studentName[0]||'ط')}</button>
              </div>
            </header>
            <div class="shell">
              <aside class="sidebar" id="sidebar">
                ${navItems(view)}
              </aside>
              <main class="main"><div class="page">${content}</div></main>
            </div>
            <nav class="bottomnav">${navItems(view, true)}</nav>
          </div>`;
        }

        function navItems(view, bottom = false) {
            const arr = [
                ['dashboard', '⌂', 'الرئيسية'],
                ['courses', '▣', 'الكورسات'],
                ['tasks', '✓', 'المهام'],
                ['code-lab', '</>', 'Code Lab'],
                ['achievements', '★', 'الإنجازات'],
                ['profile', '●', 'الملف']
            ];
            const current = view.split('/')[0];
            return arr.map(a =>
                `<button class="navbtn ${current===a[0]?'active':''}" onclick="nav('${a[0]}')">${bottom?`<b>${a[1]}</b>`:a[1]} ${bottom?'':a[2]}</button>`
            ).join('');
        }

        function bindGlobal() {
            const input = $('search');
            if (input) input.oninput = () => search(input.value);
            if (window.innerWidth <= 760) {
                const sb = $('sidebar');
                if (sb) sb.classList.remove('open');
            }
        }

        function toggleDrawer() {
            const sb = $('sidebar');
            if (sb) sb.classList.toggle('open');
        }

        /* ═══════════════════════════════════════════════════
           VIEWS — تعتمد على البيانات من Firebase
           ═══════════════════════════════════════════════════ */

        // 1. Dashboard
        function renderDashboard() {
            const totalLessons = platformContent.lessons.length;
            const completed = progress.completedLessons.length;
            const p = totalLessons ? Math.round((completed / totalLessons) * 100) : 0;
            const nextLesson = platformContent.lessons
                .sort((a, b) => a.id - b.id)
                .find(l => !progress.completedLessons.includes(l.id));

            return `<section class="hero">
            <div>
              <div class="eyebrow">MINA CODE ACADEMY</div>
              <h1>أهلاً يا ${esc(progress.studentName)} 👋</h1>
              <p>${totalLessons === 0 ? '📢 لا توجد دروس بعد — انتظر إضافة المسؤول للمحتوى.' : 'جاهز تكمل رحلة التعلم؟'}</p>
              ${totalLessons > 0 ? `<button class="btn" onclick="nav('lesson/${nextLesson?.id||platformContent.lessons[0]?.id||1}')">▶ أكمل التعلم</button>` : ''}
            </div>
            <div class="hero-stat">
              <div class="sectionhead"><b>تقدمك</b><b>${p}%</b></div>
              <div class="progress"><i style="width:${p}%"></i></div>
              <p class="muted">${totalLessons === 0 ? 'لا توجد دروس' : `${completed} / ${totalLessons} درس مكتمل`}</p>
            </div>
          </section>
          <div class="grid stats">
            ${stat('⚡','XP',`${progress.xp} XP`)}
            ${stat('◈','Level',`Level ${progress.level}`)}
            ${stat('✓','Tasks',`${progress.completedTasks.length} / ${platformContent.tasks.length}`)}
            ${stat('📚','Lessons',`${progress.completedLessons.length} / ${platformContent.lessons.length}`)}
            ${stat('🏆','Badges',progress.badges.length)}
          </div>
          <section class="section">
            <div class="sectionhead"><h2>📚 الدروس المتاحة</h2><button class="btn secondary" onclick="nav('courses')">عرض الكل</button></div>
            <div class="grid course-grid">
              ${platformContent.lessons.length === 0 ? '<div class="card empty">لا توجد دروس مضافة بعد</div>' :
              platformContent.lessons.slice(0,3).map(lessonCard).join('')}
            </div>
          </section>`;
        }

        function stat(icon, label, value) {
            return `<div class="card stat"><div style="font-size:20px">${icon}</div><div class="label">${label}</div><div class="value">${value}</div></div>`;
        }

        function lessonCard(l) {
            const done = progress.completedLessons.includes(l.id);
            return `<div class="card course">
            <div class="courseicon">📖</div>
            <h3>${esc(l.title)}</h3>
            <p>${l.difficulty} • ${l.duration} دقيقة</p>
            <div class="tags"><span class="tag">${l.difficulty}</span></div>
            <div class="continue"><span class="muted">${done ? '✅ مكتمل' : '⏳ جديد'}</span>
              <button class="btn" onclick="nav('lesson/${l.id}')">${done ? 'مراجعة' : 'ابدأ'}</button>
            </div>
          </div>`;
        }

        // 2. Courses
        function renderCourses() {
            return `<div class="sectionhead"><div><h1>جميع الدروس</h1><p class="muted">${platformContent.lessons.length} درس متاح</p></div></div>
          <div class="grid course-grid">${platformContent.lessons.length === 0 ? '<div class="card empty">📭 لا توجد دروس — تواصل مع المسؤول</div>' : platformContent.lessons.map(lessonCard).join('')}</div>`;
        }

        function renderCourse(id) {
            const l = platformContent.lessons.find(x => x.id === id);
            if (!l) return `<div class="card empty">⚠️ الدرس غير موجود</div>`;
            return renderLesson(id);
        }

        // 3. Lesson
        function renderLesson(id) {
            const l = platformContent.lessons.find(x => x.id === id);
            if (!l) return `<div class="card empty">⚠️ الدرس غير موجود</div>`;

            const done = progress.completedLessons.includes(id);
            const status = statusLesson(id);
            if (status === 'locked' && !done) {
                return `<div class="card empty">🔒 هذا الدرس مغلق — أكمل الدروس السابقة أولاً.</div>`;
            }

            const videoHtml = l.videoUrl ?
                `<div class="video-container"><iframe src="https://www.youtube.com/embed/${extractVideoId(l.videoUrl)}" allowfullscreen></iframe></div>` :
                `<div class="video-placeholder">🎬 لا يوجد فيديو لهذا الدرس</div>`;

            return `<div class="lesson-layout">
            <aside class="card lesson-side">
              <b>المحتوى</b>
              <div class="progress" style="margin:12px 0"><i style="width:${pct()}%"></i></div>
              <small class="muted">${pct()}% مكتمل</small>
              <div class="list" style="margin-top:15px">
                ${platformContent.lessons.sort((a,b)=>a.id-b.id).map(x => `
                  <button class="navbtn ${x.id===id?'active':''}" onclick="nav('lesson/${x.id}')">
                    ${x.id}. ${x.title} ${progress.completedLessons.includes(x.id)?'✅':''}
                  </button>
                `).join('')}
              </div>
            </aside>
            <article class="card">
              <div class="eyebrow">LESSON ${String(l.id).padStart(2,'0')}</div>
              <h1>${esc(l.title)}</h1>
              <p class="muted">${l.duration} دقيقة • ${l.difficulty}</p>
              ${videoHtml}
              <h2>شرح الدرس</h2>
              <p style="line-height:2">${l.content || 'هنا سيكون شرح الدرس. يمكن للمسؤول إضافة محتوى نصي.'}</p>
              ${l.code ? `<h2>Code Example</h2>${codeBlock(l.code)}` : ''}
              <div style="display:flex;gap:8px;flex-wrap:wrap;margin:12px 0">
                ${l.code ? `<button class="btn secondary" onclick="copyCode(${JSON.stringify(l.code)})">📋 Copy</button>` : ''}
                <button class="btn secondary" onclick="openLab('${l.code || 'console.log("مرحباً")'}')">▶ Try Code</button>
              </div>
              <div style="margin-top:18px">
                ${done ? `<span class="pill success">✓ الدرس مكتمل</span>` :
                `<button class="btn success" onclick="completeLesson(${l.id})">✓ إكمال الدرس +${CONFIG.xp.lesson} XP</button>`}
              </div>
            </article>
          </div>`;
        }

        function extractVideoId(url) {
            if (!url) return '';
            const match = url.match(/(?:v=|\/)([0-9A-Za-z_-]{11})(?:[&?]|$)/);
            return match ? match[1] : '';
        }

        function codeBlock(code) {
            return `<div class="code"><div class="codehead"><span>JavaScript</span><button class="btn secondary" style="padding:5px 9px" onclick="copyCode(${JSON.stringify(code)})">Copy</button></div><pre>${esc(code)}</pre></div>`;
        }

        function completeLesson(id) {
            if (!progress.completedLessons.includes(id)) {
                progress.completedLessons.push(id);
                addXP(CONFIG.xp.lesson);
                if (!progress.badges.includes('First Lesson')) progress.badges.push('First Lesson');
                saveProgress();
                render();
                toast('✅ تم إكمال الدرس');
            }
        }

        function openLab(code) {
            location.hash = 'code-lab';
            render();
            setTimeout(() => { const ed = $('editor'); if (ed) ed.value = code; }, 50);
        }

        // 4. Tasks
        function renderTasks() {
            return `<div class="sectionhead"><div><h1>المهام</h1><p class="muted">طبق ما تعلمته</p></div></div>
          <div class="list">${platformContent.tasks.length === 0 ? '<div class="card empty">🎯 لا توجد مهام حالياً</div>' :
            platformContent.tasks.map(t => `<div class="card taskrow">
              <div class="lessonnum">#${t.id}</div>
              <div class="grow"><b>${esc(t.title)}</b><div class="muted">${t.difficulty} • +${t.xp} XP</div></div>
              <span class="pill ${progress.completedTasks.includes(t.id)?'success':''}">${progress.completedTasks.includes(t.id)?'✅ Completed':'⏳ Pending'}</span>
              <button class="btn" onclick="nav('task/${t.id}')">${progress.completedTasks.includes(t.id)?'مراجعة':'ابدأ'}</button>
            </div>`).join('')}</div>`;
        }

        function renderTask(id) {
            const t = platformContent.tasks.find(x => x.id === id);
            if (!t) return `<div class="card empty">⚠️ المهمة غير موجودة</div>`;
            return `<div class="card">
            <div class="eyebrow">TASK #${t.id}</div>
            <h1>${esc(t.title)}</h1>
            <div class="tags"><span class="pill">${t.difficulty}</span><span class="pill">+${t.xp} XP</span></div>
            <h3>المطلوب</h3>
            <p class="muted">${t.desc || 'أكمل الكود المطلوب.'}</p>
            <h3>المحرر</h3>
            <textarea class="editor" id="taskEditor">${esc(t.starter || '// اكتب الكود هنا')}</textarea>
            <div style="display:flex;gap:8px;margin:10px 0">
              <button class="btn" onclick="runJS('taskEditor','taskOutput')">▶ Run</button>
              <button class="btn secondary" onclick="submitTask(${t.id})">Submit</button>
            </div>
            <h3>النتيجة</h3>
            <div class="output" id="taskOutput">اضغط Run لتجربة الكود...</div>
          </div>`;
        }

        function submitTask(id) {
            if (!progress.completedTasks.includes(id)) {
                const t = platformContent.tasks.find(x => x.id === id);
                if (!t) return;
                progress.completedTasks.push(id);
                addXP(t.xp || 30);
                if (progress.completedTasks.length === 5 && !progress.badges.includes('5 Tasks')) progress.badges.push(
                    '5 Tasks');
                if (!progress.badges.includes('Problem Solver')) progress.badges.push('Problem Solver');
                saveProgress();
                render();
                toast('✅ تم تسليم المهمة');
            } else {
                toast('📌 المهمة مكتملة بالفعل');
            }
        }

        // 5. Code Lab
        function renderCodeLab() {
            return `<div class="sectionhead"><div><h1>⚡ Code Lab</h1><p class="muted">بيئة تجريبية JavaScript</p></div></div>
          <div class="card">
            <textarea class="editor" id="editor">console.log("مرحباً في Code Lab!");</textarea>
            <div style="display:flex;gap:8px;margin:12px 0;flex-wrap:wrap">
              <button class="btn" onclick="runJS('editor','output')">▶ Run</button>
              <button class="btn secondary" onclick="$('#editor').value='';$('#output').textContent=''">🧹 Clear</button>
            </div>
            <h3>Output</h3>
            <div class="output" id="output">جاهز للتشغيل...</div>
          </div>`;
        }

        function runJS(editorId, outId) {
            const code = $('#' + editorId).value;
            const out = $('#' + outId);
            try {
                const logs = [];
                const c = { log: (...a) => logs.push(a.map(x => typeof x === 'object' ? JSON.stringify(x) : String(x))
                        .join(' ')) };
                const fn = new Function('console', `"use strict";${code}`);
                fn(c);
                out.textContent = logs.join('\n') || '✓ تم التنفيذ';
                if (!progress.badges.includes('First Code')) { progress.badges.push('First Code');
                    saveProgress(); }
            } catch (e) {
                out.textContent = '❌ ' + e.message;
            }
        }

        // 6. Achievements
        function renderAchievements() {
            const allBadges = [
                ['🎯', 'First Lesson', 'أول درس مكتمل'],
                ['💻', 'First Code', 'أول كود شغال'],
                ['🔥', '7 Days Streak', '7 أيام متتالية'],
                ['🏆', '5 Tasks', '5 مهام مكتملة'],
                ['🚀', '1000 XP', 'وصول 1000 XP'],
                ['🧠', 'Problem Solver', 'حل مشكلة'],
                ['🔬', 'Code Explorer', 'جرب Code Lab']
            ];
            return `<div class="sectionhead"><div><h1>🏆 الإنجازات</h1></div></div>
          <div class="grid badgegrid">${allBadges.map(b => {
            const got = progress.badges.includes(b[1]);
            return `<div class="card badge ${got?'':'locked'}"><div class="badgeicon">${b[0]}</div><div><b>${b[1]}</b><div class="muted">${b[2]}</div><span class="pill ${got?'success':''}">${got?'✅ مفتوح':'🔒 مغلق'}</span></div></div>`;
          }).join('')}</div>`;
        }

        // 7. Profile
        function renderProfile() {
            return `<div class="card hero"><div>
            <div class="avatar" style="display:grid;place-items:center;width:70px;height:70px;font-size:25px">${esc(progress.studentName[0]||'ط')}</div>
            <h1>${esc(progress.studentName)}</h1>
            <p class="muted">${levelName()} • ${progress.xp} XP</p>
          </div>
          <div class="hero-stat"><b>Level ${progress.level}</b><div class="progress" style="margin-top:10px"><i style="width:${(progress.xp%300)/3}%"></i></div><small class="muted">${progress.xp%300}/300 XP للمستوى التالي</small></div>
        </div>
        <div class="grid stats">
          ${stat('🏆','Badges',progress.badges.length)}
          ${stat('📚','Lessons',`${progress.completedLessons.length}/${platformContent.lessons.length}`)}
          ${stat('✓','Tasks',`${progress.completedTasks.length}/${platformContent.tasks.length}`)}
          ${stat('📖','Total XP',progress.xp)}
        </div>
        <div class="card"><h2>📊 إحصائيات سريعة</h2>
          <p class="muted">الدروس المكتملة: ${progress.completedLessons.length} | المهام المسلمة: ${progress.completedTasks.length}</p>
        </div>`;
        }

        // 8. Search
        function search(q) {
            const box = document.getElementById('search');
            if (!q.trim()) { toast('🔎 اكتب كلمة للبحث'); return; }
            const results = [...platformContent.lessons.filter(l => l.title.includes(q)).map(l => ({ t: l.title, r: 'lesson/' +
                        l.id }))];
            if (results.length) {
                toast(`🔍 وجدت ${results.length} نتيجة: ${results.map(r=>r.t).join(', ')}`);
            } else {
                toast('❌ لا توجد نتائج');
            }
        }

        /* ═══════════════════════════════════════════════════
           INIT
           ═══════════════════════════════════════════════════ */
        function init() {
            const ok = initFirebase();
            if (ok) {
                signInAnonymously();
            } else {
                fallbackLocal();
            }
            window.addEventListener('hashchange', render);
            window.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
        }

        // بدء التشغيل
        init();
    </script>
</body>
</html>
