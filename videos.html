<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>الفيديوهات - منصة THE BEST</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Cairo', sans-serif;
      background: #0d0d0d;
      color: #fff;
      margin: 0;
      padding: 15px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    header h1 {
      color: #ffd700;
      font-size: 1.6rem;
      margin: 0;
      font-weight: 900;
      text-align: center;
      flex-grow: 1;
    }

    #back {
      background: rgba(255, 215, 0, 0.1);
      border: 1.5px solid #ffd700;
      color: #ffd700;
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: 0.3s;
      margin-left: 5px;
    }

    #back:hover {
      background: rgba(255, 215, 0, 0.2);
      transform: translateY(-1px);
    }

    #videos-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 15px;
      max-width: 1100px;
      margin: auto;
    }

    .video-box {
      background: #1a1a1a;
      border: 1px solid rgba(255, 215, 0, 0.15);
      border-radius: 12px;
      padding: 12px;
      transition: 0.3s;
      overflow: hidden;
      box-shadow: 0 0 10px rgba(255,215,0,0.05);
    }

    .video-box:hover {
      transform: translateY(-4px);
      box-shadow: 0 0 18px rgba(255,215,0,0.25);
    }

    .video-title {
      font-size: 18px;
      font-weight: 800;
      color: #ffd700;
      text-align: center;
      margin-bottom: 8px;
    }

    .thumb {
      background: #000;
      border-radius: 10px;
      height: 160px;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      cursor: pointer;
    }

    .thumb::after {
      content: "▶";
      position: absolute;
      font-size: 40px;
      color: #ffd700;
      text-shadow: 0 0 10px rgba(0, 0, 0, 0.9);
      transition: transform 0.3s ease;
    }

    .thumb:hover::after {
      transform: scale(1.1);
    }

    .loading, .error {
      text-align: center;
      color: #ffd700;
      font-size: 17px;
      padding: 20px;
    }

    footer {
      text-align: center;
      color: #888;
      margin-top: 35px;
      font-size: 0.85rem;
      border-top: 1px solid rgba(255, 215, 0, 0.1);
      padding-top: 15px;
    }

    footer span {
      color: #ffd700;
    }

    /* ✅ نافذة اختيار الجودات */
    .popup {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 999;
      display: none;
    }

    .popup-content {
      background: #1a1a1a;
      border: 2px solid #ffd700;
      border-radius: 14px;
      padding: 20px;
      text-align: center;
      width: 300px;
      box-shadow: 0 0 20px rgba(255,215,0,0.2);
    }

    .popup-content h3 {
      color: #ffd700;
      margin-bottom: 15px;
      font-size: 20px;
    }

    .quality-btn {
      display: block;
      background: #ffd700;
      color: #000;
      border: none;
      padding: 10px 15px;
      margin: 8px auto;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s;
      width: 80%;
    }

    .quality-btn:hover {
      background: #e6c200;
      transform: translateY(-2px);
    }

    .cancel-btn {
      margin-top: 10px;
      background: none;
      border: 1px solid #ffd700;
      color: #ffd700;
      padding: 8px 20px;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
    }

    .cancel-btn:hover {
      background: rgba(255,215,0,0.1);
    }
  </style>
</head>

<body>
  <header>
    <button id="back">⬅ رجوع</button>
    <h1>🎬 الفيديوهات</h1>
    <div style="width:35px;"></div>
  </header>

  <main>
    <div id="videos-container">
      <div class="loading">⏳....𝑳𝒐𝒂𝒅𝒊𝒏𝒈</div>
    </div>
  </main>

  <footer>
    © جميع الحقوق محفوظة لمنصة <span>الثانويه بلس</span> 🔥
  </footer>

  <!-- ✅ نافذة اختيار الجوده -->
  <div id="popup" class="popup">
    <div class="popup-content">
      <h3>اختر الجودة 🎥</h3>
      <div id="quality-options"></div>
      <button class="cancel-btn" onclick="closePopup()">إلغاء</button>
    </div>
  </div>


<script>
// 🎯 Toast فقط عند الخطأ
function showToast(message, type = "info") {
  const toast = document.createElement("div");
  toast.className = `custom-toast ${type}`;
  toast.innerHTML = `<span>${message}</span>`;

  const style = document.createElement("style");
  style.textContent = `
    .custom-toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      padding: 14px 22px;
      border-radius: 14px;
      font-family: "Cairo", sans-serif;
      font-weight: 600;
      font-size: 15px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.3);
      animation: slideIn 0.4s ease, fadeOut 0.4s ease 2.4s forwards;
      z-index: 9999;
    }
    .custom-toast.error { background: linear-gradient(135deg,#e74c3c,#c0392b); }

    @keyframes slideIn { from { transform: translateX(120%); opacity: 0; } 
                          to { transform: translateX(0); opacity: 1; } }
    @keyframes fadeOut { to { opacity: 0; transform: translateX(120%); } }
  `;
  document.head.appendChild(style);
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 3000);
}

// 🌟 تحقق صامت من الفايربيس عند كل تحميل صفحة
document.addEventListener("DOMContentLoaded", async () => {
  try {
    const isApproved = localStorage.getItem("approved");
    const uid        = localStorage.getItem("localUid");

    // لو أصلاً مش متسجل — طرده بدون توست
    if (isApproved !== "true" || !uid) {
      window.location.href = "index.html";
      return;
    }

    // 🔥 تحقق فوري من الفايربيس بدون أي توست
    const dbUrl = "https://plus-c3d02-default-rtdb.firebaseio.com/approvedStudents.json";
    const res = await fetch(dbUrl);
    const data = await res.json();

    const exists = Object.values(data || {}).some(v => v.deviceId === uid);

    // لو الحساب اتحذف — هنا فقط نستخدم التوست
    if (!exists) {
      localStorage.clear();
      showToast("⚠️ تم حذف حسابك — أعد التسجيل", "error");
      setTimeout(() => window.location.href = "index.html", 1500);
      return;
    }

    // 🟢 الحساب سليم — بدون أي توست
    document.dispatchEvent(new Event("authReady"));

  } catch (err) {
    console.error(err);
    // خطأ في الاتصال — ارجع للصفحة الرئيسية بدون أي رسالة
    setTimeout(() => window.location.href = "index.html", 1500);
  }
});
</script>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const subject = urlParams.get("subject");
  const teacher = urlParams.get("teacher");
  const chapter = urlParams.get("chapter");
  const lecture = urlParams.get("lecture");

  const videosContainer = document.getElementById("videos-container");
  const backBtn = document.getElementById("back");
  const popup = document.getElementById("popup");
  const qualityOptions = document.getElementById("quality-options");

  backBtn.onclick = () => {
    window.location.href =
      `lecture_name.html?subject=${encodeURIComponent(subject)}&teacher=${encodeURIComponent(teacher)}&chapter=${encodeURIComponent(chapter)}`;
  };

  function normalize(str) {
    return (str || "").trim().replace(/[\s.\-ـ_]/g, "").toLowerCase();
  }

  function closePopup() {
    popup.style.display = "none";
  }

  function showQualityOptions(video) {
    qualityOptions.innerHTML = "";
    popup.style.display = "flex";

    video.links.forEach(link => {
      const btn = document.createElement("button");
      btn.className = "quality-btn";
      btn.textContent = link.label ? link.label + "p" : "غير معروف";
      btn.onclick = () => {
        localStorage.setItem("video_sources", JSON.stringify(link));
        localStorage.setItem("video_title", video.name);
        window.location.href = "player.html";
      };
      qualityOptions.appendChild(btn);
    });
  }

  async function loadVideos() {
    try {
      // 🔥 جلب البيانات من الـ Proxy المحمي
const res = await fetch("/api/proxy");

if (!res.ok) {
    throw new Error("فشل تحميل البيانات");
}

const json = await res.json();
const data = json.data || json;


      const wantedSubject = normalize(subject);
      const wantedTeacher = normalize(teacher);
      const wantedChapter = normalize(chapter);
      const wantedLecture = normalize(lecture);

      const videos = [];

      (data || []).forEach((year) => {
        (year.subjects || []).forEach((sub) => {
          if (normalize(sub.subject_name).includes(wantedSubject)) {
            (sub.teachers || []).forEach((t) => {
              if (normalize(t.teacher_name).includes(wantedTeacher)) {
                (t.chapters || []).forEach((chap) => {
                  if (normalize(chap.chapter_name).includes(wantedChapter)) {
                    (chap.lectures || []).forEach((lec) => {
                      if (!lecture || normalize(lec.lecture_name).includes(wantedLecture)) {
                        (lec.videos || []).forEach((vid) => {
                          if (vid.links && vid.links.length > 0) {
                            videos.push({
                              name: vid.video_name,
                              links: vid.links
                            });
                          }
                        });
                      }
                    });
                  }
                });
              }
            });
          }
        });
      });

      videosContainer.innerHTML = "";

      if (videos.length === 0) {
        videosContainer.innerHTML =
          "<div class='error'>⚠️ لا توجد فيديوهات في هذه المحاضرة.</div>";
        return;
      }

      videos.forEach((video) => {
        const box = document.createElement("div");
        box.className = "video-box";
        box.innerHTML = `
          <div class="video-title">${video.name}</div>
          <div class="thumb"></div>
        `;
        box.querySelector(".thumb").onclick = () => showQualityOptions(video);
        videosContainer.appendChild(box);
      });

    } catch (err) {
      console.error(err);
      videosContainer.innerHTML =
        "<div class='error'>❌ حدث خطأ أثناء تحميل البيانات.</div>";
    }
  }

  loadVideos();
</script>

</body>
</html>
