<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خطأ في النظام</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 0;
        }
        .container {
            text-align: center;
            background-color: #fff;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 80%;
            max-width: 600px;
        }
        .error-icon {
            font-size: 60px;
            color: #f44336;
        }
        .error-message {
            font-size: 24px;
            margin: 20px 0;
            color: #444;
        }
        .error-details {
            font-size: 16px;
            color: #888;
            margin-bottom: 20px;
        }
        .thank-you-message {
            font-size: 18px;
            color: #4CAF50;
        }
        .btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
        }
        .btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="error-icon">&#9888;</div>
        <div class="error-message">
            عذراً، هناك مشكلة في النظام
        </div>
        <div class="error-details">
            تم اكتشاف خطأ غير متوقع في النظام. نحن نعمل على حل المشكلة في أسرع وقت ممكن.
        </div>
        <div class="thank-you-message">
            شكراً لتفهمك وصبرك. سيتم إعلامك عندما يتم إصلاح المشكلة.
        </div>
        <a href="#" class="btn">إعادة تحميل الصفحة</a>
    </div>

</body>
</html>
