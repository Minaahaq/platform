<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>لوحة تحكم MINA CODE — إدارة المحتوى</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js">
    </script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js">
    </script>
    <style>
        /* ── Reset & Variables ── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg: #0e1422;
            --bg2: #161d2f;
            --panel: #1a2338;
            --panel2: #222d4a;
            --text: #edf2ff;
            --muted: #8895b9;
            --border: #2b3a5a;
            --primary: #7c5cff;
            --primary2: #5b8cff;
            --success: #26d07c;
            --danger: #ff5d73;
            --warn: #ffbf47;
            --shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
            --radius: 16px;
            --transition: 0.25s ease;
        }
        .light {
            --bg: #f2f5fa;
            --bg2: #e6ecf5;
            --panel: #ffffff;
            --panel2: #f0f4fe;
            --text: #111827;
            --muted: #5a6a8a;
            --border: #d6deee;
            --shadow: 0 8px 30px rgba(0, 20, 50, 0.10);
        }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            transition: background var(--transition), color var(--transition);
            min-height: 100vh;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg2);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 12px;
        }

        /* Loader */
        #loader {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        #loader.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* App Layout */
        .app {
            display: flex;
            min-height: 100vh;
        }
        .sidebar {
            width: 270px;
            background: var(--panel);
            border-left: 1px solid var(--border);
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            position: fixed;
            top: 0;
            bottom: 0;
            right: 0;
            z-index: 100;
            transition: transform var(--transition), background var(--transition);
            overflow-y: auto;
        }
        .sidebar .brand {
            font-size: 20px;
            font-weight: 900;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .sidebar .brand b {
            color: var(--primary);
        }
        .sidebar .brand small {
            font-size: 11px;
            color: var(--muted);
            font-weight: 400;
            display: block;
        }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 16px;
            border-radius: 12px;
            color: var(--muted);
            background: transparent;
            border: none;
            width: 100%;
            font-size: 14px;
            font-weight: 500;
            transition: all var(--transition);
            cursor: pointer;
        }
        .nav-item:hover,
        .nav-item.active {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 4px 14px rgba(124, 92, 255, 0.35);
        }
        .nav-item .icon {
            font-size: 20px;
            width: 28px;
            text-align: center;
        }
        .nav-divider {
            height: 1px;
            background: var(--border);
            margin: 8px 0;
        }

        .main {
            margin-right: 270px;
            flex: 1;
            padding: 28px 32px 80px;
            background: var(--bg);
            transition: background var(--transition);
        }
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
            flex-wrap: wrap;
            gap: 16px;
        }
        .topbar h1 {
            font-size: 26px;
            font-weight: 800;
        }
        .topbar h1 small {
            font-size: 14px;
            font-weight: 400;
            color: var(--muted);
            display: block;
        }
        .topbar-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .topbar-actions button {
            background: var(--panel);
            border: 1px solid var(--border);
            color: var(--text);
            width: 42px;
            height: 42px;
            border-radius: 12px;
            font-size: 18px;
            display: grid;
            place-items: center;
            cursor: pointer;
            transition: all var(--transition);
        }
        .topbar-actions button:hover {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }
        .avatar-btn {
            background: linear-gradient(135deg, var(--primary), var(--primary2)) !important;
            color: #fff !important;
            font-weight: 700;
            font-size: 16px;
            border: none !important;
        }
        .menu-toggle {
            display: none;
            background: var(--panel);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 6px 14px;
            border-radius: 10px;
            font-size: 22px;
            cursor: pointer;
        }

        /* Cards */
        .card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px 22px;
            box-shadow: var(--shadow);
            transition: background var(--transition), border var(--transition);
        }
        .card-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 18px;
            margin-bottom: 28px;
        }
        .stat-card {
            padding: 18px 20px;
            border-right: 4px solid var(--primary);
        }
        .stat-card .label {
            font-size: 13px;
            color: var(--muted);
        }
        .stat-card .value {
            font-size: 30px;
            font-weight: 900;
            margin-top: 4px;
        }

        .chart-row {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            margin-bottom: 28px;
        }
        .chart-box {
            height: 210px;
            position: relative;
        }

        .table-wrap {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        th {
            text-align: right;
            padding: 12px 8px;
            color: var(--muted);
            font-weight: 600;
            border-bottom: 1px solid var(--border);
        }
        td {
            padding: 12px 8px;
            border-bottom: 1px solid var(--border);
        }
        .badge-status {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 99px;
            font-size: 12px;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 14px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 4px;
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--bg2);
            color: var(--text);
            font-size: 14px;
            transition: border var(--transition);
            outline: none;
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: var(--primary);
        }

        .btn {
            padding: 10px 22px;
            border-radius: 10px;
            border: none;
            font-weight: 600;
            font-size: 14px;
            background: var(--primary);
            color: #fff;
            cursor: pointer;
            transition: all var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn:hover {
            filter: brightness(1.15);
            transform: translateY(-1px);
        }
        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
        }
        .btn-outline:hover {
            background: var(--border);
        }
        .btn-success {
            background: var(--success);
            color: #032b14;
        }
        .btn-danger {
            background: var(--danger);
            color: #fff;
        }
        .btn-sm {
            padding: 5px 12px;
            font-size: 12px;
        }

        .flex {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .mt-2 {
            margin-top: 16px;
        }
        .mb-2 {
            margin-bottom: 16px;
        }
        .text-muted {
            color: var(--muted);
        }
        .text-center {
            text-align: center;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(4px);
            z-index: 200;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-overlay.open {
            display: flex;
        }
        .modal-box {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 28px 30px;
            box-shadow: var(--shadow);
            animation: modalIn 0.25s ease;
        }
        @keyframes modalIn {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: none;
            }
        }
        .modal-box .close-btn {
            float: left;
            background: none;
            border: none;
            font-size: 24px;
            color: var(--muted);
            cursor: pointer;
        }

        /* Toast */
        .toast-wrap {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 300;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .toast {
            padding: 12px 20px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: var(--shadow);
            animation: slideIn 0.3s ease;
            font-size: 14px;
            max-width: 360px;
        }
        @keyframes slideIn {
            from {
                transform: translateX(-20px);
                opacity: 0;
            }
            to {
                transform: none;
                opacity: 1;
            }
        }

        @media (max-width: 900px) {
            .sidebar {
                transform: translateX(100%);
                width: 280px;
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .main {
                margin-right: 0;
                padding: 18px 16px 80px;
            }
            .menu-toggle {
                display: block;
            }
            .chart-row {
                grid-template-columns: 1fr;
            }
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        @media (max-width: 500px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }
            .topbar h1 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>

    <!-- Loader -->
    <div id="loader">
        <div class="spinner"></div>
        <p>⏳ جاري التحميل...</p>
    </div>

    <!-- App -->
    <div class="app" id="app">
        <aside class="sidebar" id="sidebar">
            <div class="brand">
                <span>📊</span>
                <div><b>MINA</b> CODE <small>لوحة التحكم</small></div>
            </div>
            <button class="nav-item active" data-view="dashboard"><span class="icon">📈</span> الرئيسية</button>
            <button class="nav-item" data-view="users"><span class="icon">👥</span> المستخدمين</button>
            <button class="nav-item" data-view="content"><span class="icon">📚</span> المحتوى</button>
            <button class="nav-item" data-view="analytics"><span class="icon">📊</span> التحليلات</button>
            <button class="nav-item" data-view="notifications"><span class="icon">🔔</span> الإشعارات</button>
            <div class="nav-divider"></div>
            <button class="nav-item" data-view="settings"><span class="icon">⚙️</span> الإعدادات</button>
            <button class="nav-item" id="logoutBtn"><span class="icon">🚪</span> تسجيل الخروج</button>
        </aside>

        <main class="main" id="mainContent">
            <div class="topbar">
                <div>
                    <h1 id="pageTitle">الرئيسية <small>نظرة عامة على المنصة</small></h1>
                </div>
                <div class="topbar-actions">
                    <button id="themeToggle" title="تبديل المظهر">🌓</button>
                    <button class="avatar-btn" id="userAvatar">M</button>
                    <button class="menu-toggle" id="menuToggle">☰</button>
                </div>
            </div>
            <div id="pageContent"></div>
        </main>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box">
            <button class="close-btn" id="modalClose">✕</button>
            <div id="modalBody"></div>
        </div>
    </div>

    <div class="toast-wrap" id="toastWrap"></div>

    <script>
        /* ═══════════════════════════════════════════════════
           FIREBASE CONFIG
           ═══════════════════════════════════════════════════ */
        const firebaseConfig = {
            apiKey: "AIzaSyB0p0us6BuzD2ngzjhRnmUIhlOcBeRp0vQ",
            authDomain: "tok-tak-d6e17.firebaseapp.com",
            databaseURL: "https://tok-tak-d6e17-default-rtdb.firebaseio.com",
            projectId: "tok-tak-d6e17",
            storageBucket: "tok-tak-d6e17.appspot.com",
            messagingSenderId: "547062578826",
            appId: "1:547062578826:web:aa285cf798341be07cb773",
            measurementId: "G-7EMKEQKPVV"
        };

        /* ═══════════════════════════════════════════════════
           STATE — تبدأ فارغة تماماً
           ═══════════════════════════════════════════════════ */
        let currentUser = null;
        let userRef = null;
        let allUsers = {}; // فارغة
        let allContent = { lessons: [], tasks: [], quizzes: [] }; // فارغة
        let chartInstances = {};
        let currentView = 'dashboard';

        /* ═══════════════════════════════════════════════════
           UTILITIES
           ═══════════════════════════════════════════════════ */
        const $ = id => document.getElementById(id);
        const qs = (sel, ctx = document) => ctx.querySelector(sel);
        const qsa = (sel, ctx = document) => [...ctx.querySelectorAll(sel)];

        function esc(str) {
            return String(str ?? '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;',
                "'": '&#039;' } [m]));
        }

        function toast(msg) {
            const wrap = $('toastWrap');
            const el = document.createElement('div');
            el.className = 'toast';
            el.textContent = msg;
            wrap.appendChild(el);
            setTimeout(() => el.remove(), 3000);
        }

        function showLoader(show = true) {
            const el = $('loader');
            if (show) el.classList.remove('hidden');
            else el.classList.add('hidden');
        }

        function openModal(html) {
            $('modalBody').innerHTML = html;
            $('modalOverlay').classList.add('open');
        }

        function closeModal() {
            $('modalOverlay').classList.remove('open');
        }

        function formatDate(ts) {
            if (!ts) return '—';
            return new Date(ts).toLocaleDateString('ar-EG', { year: 'numeric', month: 'short', day: 'numeric' });
        }

        /* ═══════════════════════════════════════════════════
           FIREBASE INIT & AUTH
           ═══════════════════════════════════════════════════ */
        let firebaseReady = false;

        function initFirebase() {
            try { firebase.initializeApp(firebaseConfig);
                firebaseReady = true; return true; } catch (e) { console.warn(e); return false; }
        }

        function signInAnonymously() {
            if (!firebaseReady) { fallbackLocal(); return; }
            firebase.auth().signInAnonymously()
                .then(cred => {
                    currentUser = cred.user;
                    userRef = firebase.database().ref('admin/' + currentUser.uid);
                    userRef.on('value', snap => {
                        const data = snap.val();
                        if (data) {
                            if (data.users) allUsers = data.users || {};
                            if (data.content) allContent = data.content || { lessons: [], tasks: [],
                            quizzes: [] };
                        } else {
                            // لأول مرة — نضع بيانات فارغة تماماً
                            const empty = { users: {}, content: { lessons: [], tasks: [], quizzes: [] } };
                            userRef.set(empty);
                            allUsers = {};
                            allContent = { lessons: [], tasks: [], quizzes: [] };
                        }
                        renderCurrentView();
                        showLoader(false);
                    });
                })
                .catch(err => { console.warn(err);
                    fallbackLocal(); });
        }

        function fallbackLocal() {
            toast('⚠️ وضع غير متصل — بيانات محلية (فارغة)');
            allUsers = {};
            allContent = { lessons: [], tasks: [], quizzes: [] };
            showLoader(false);
            renderCurrentView();
        }

        /* ═══════════════════════════════════════════════════
           SAVE
           ═══════════════════════════════════════════════════ */
        function saveData() {
            if (!userRef) return;
            userRef.update({ users: allUsers, content: allContent }).catch(err => console.warn(err));
        }

        /* ═══════════════════════════════════════════════════
           RENDER
           ═══════════════════════════════════════════════════ */
        function renderCurrentView() {
            const views = {
                dashboard: renderDashboard,
                users: renderUsers,
                content: renderContent,
                analytics: renderAnalytics,
                notifications: renderNotifications,
                settings: renderSettings,
            };
            const fn = views[currentView] || renderDashboard;
            $('pageContent').innerHTML = fn();
            qsa('.nav-item').forEach(el => {
                el.classList.toggle('active', el.dataset.view === currentView);
            });
            const titles = { dashboard: 'الرئيسية', users: 'المستخدمين', content: 'المحتوى', analytics: 'التحليلات',
                notifications: 'الإشعارات', settings: 'الإعدادات' };
            const subtitles = { dashboard: 'نظرة عامة', users: 'إدارة الحسابات', content: 'إضافة الدروس والمهام والاختبارات',
                analytics: 'إحصائيات', notifications: 'إرسال الإشعارات', settings: 'الإعدادات' };
            $('pageTitle').innerHTML = `${titles[currentView]||'الرئيسية'} <small>${subtitles[currentView]||''}</small>`;
            if (currentView === 'analytics' || currentView === 'dashboard') setTimeout(initCharts, 150);
        }

        /* ═══════════════════════════════════════════════════
           VIEW: DASHBOARD
           ═══════════════════════════════════════════════════ */
        function renderDashboard() {
            const uCount = Object.keys(allUsers).length;
            const lCount = allContent.lessons.length;
            const tCount = allContent.tasks.length;
            const qCount = allContent.quizzes.length;
            const totalXP = Object.values(allUsers).reduce((s, u) => s + (u.xp || 0), 0);
            const avgXP = uCount ? Math.round(totalXP / uCount) : 0;

            return `
            <div class="stats-grid">
              <div class="card stat-card"><div class="label">👥 المستخدمين</div><div class="value">${uCount}</div></div>
              <div class="card stat-card" style="border-color:var(--success)"><div class="label">📚 الدروس</div><div class="value">${lCount}</div></div>
              <div class="card stat-card" style="border-color:var(--warn)"><div class="label">🎯 المهام</div><div class="value">${tCount}</div></div>
              <div class="card stat-card" style="border-color:var(--primary2)"><div class="label">❓ الاختبارات</div><div class="value">${qCount}</div></div>
              <div class="card stat-card" style="border-color:var(--danger)"><div class="label">⭐ متوسط XP</div><div class="value">${avgXP}</div></div>
            </div>
            <div class="chart-row">
              <div class="card"><div class="card-title">📊 نشاط المستخدمين (آخر 7 أيام)</div><div class="chart-box"><canvas id="activityChart"></canvas></div></div>
              <div class="card"><div class="card-title">🏆 توزيع المستويات</div><div class="chart-box"><canvas id="levelChart"></canvas></div></div>
            </div>
            <div class="card"><div class="card-title">🕒 أحدث النشاطات</div>
              <div class="table-wrap"><table><thead><tr><th>المستخدم</th><th>النشاط</th><th>التاريخ</th></tr></thead><tbody>
                ${uCount === 0 ? '<tr><td colspan="3" class="text-center text-muted">لا توجد بيانات لعرضها</td></tr>' :
                `<tr><td>—</td><td>أضف مستخدمين ومحتوى لرؤية الإحصائيات</td><td>—</td></tr>`}
              </tbody></table></div>
            </div>
          `;
        }

        /* ═══════════════════════════════════════════════════
           VIEW: USERS
           ═══════════════════════════════════════════════════ */
        function renderUsers() {
            const entries = Object.entries(allUsers);
            return `
            <div class="card mb-2"><div class="flex">
              <span class="card-title" style="margin:0">👥 قائمة المستخدمين (${entries.length})</span>
              <button class="btn" onclick="openAddUserModal()">➕ إضافة مستخدم</button>
            </div></div>
            <div class="card"><div class="table-wrap"><table><thead><tr><th>الاسم</th><th>البريد</th><th>XP</th><th>المستوى</th><th>تاريخ الانضمام</th><th>إجراءات</th></tr></thead><tbody>
              ${entries.length === 0 ? '<tr><td colspan="6" class="text-center text-muted">لا يوجد مستخدمون — أضف مستخدم الآن</td></tr>' :
              entries.map(([id, u]) => `
                <tr><td><b>${esc(u.name)}</b></td><td>${esc(u.email)}</td><td>${u.xp||0}</td><td>Level ${u.level||1}</td><td>${formatDate(u.joined)}</td>
                <td><button class="btn btn-outline btn-sm" onclick="editUser('${id}')">✏️</button> <button class="btn btn-danger btn-sm" onclick="deleteUser('${id}')">🗑️</button></td></tr>
              `).join('')}
            </tbody></table></div></div>
          `;
        }

        /* ═══════════════════════════════════════════════════
           VIEW: CONTENT (مع دعم يوتيوب)
           ═══════════════════════════════════════════════════ */
        function renderContent() {
            const { lessons, tasks, quizzes } = allContent;
            return `
            <div class="flex mb-2">
              <button class="btn" onclick="openAddContent('lesson')">📖 إضافة درس</button>
              <button class="btn btn-success" onclick="openAddContent('task')">🎯 إضافة مهمة</button>
              <button class="btn" style="background:var(--warn);color:#2e2400" onclick="openAddContent('quiz')">❓ إضافة اختبار</button>
            </div>
            <div class="card"><div class="card-title">📚 الدروس (${lessons.length})</div>
              <div class="table-wrap"><table><thead><tr><th>#</th><th>العنوان</th><th>الصعوبة</th><th>المدة</th><th>🎬 يوتيوب</th><th>إجراءات</th></tr></thead><tbody>
                ${lessons.length === 0 ? '<tr><td colspan="6" class="text-muted text-center">لا توجد دروس — أضف درساً الآن</td></tr>' :
                lessons.map(l => `<tr><td>${l.id}</td><td>${esc(l.title)}</td><td>${l.difficulty}</td><td>${l.duration} د</td>
                  <td>${l.videoUrl ? `<a href="${esc(l.videoUrl)}" target="_blank" style="color:var(--primary2)">رابط</a>` : '—'}</td>
                  <td><button class="btn btn-danger btn-sm" onclick="deleteContent('lesson',${l.id})">🗑️</button></td></tr>`).join('')}
              </tbody></table></div>
            </div>
            <div class="card mt-2"><div class="card-title">🎯 المهام (${tasks.length})</div>
              <div class="table-wrap"><table><thead><tr><th>#</th><th>العنوان</th><th>الصعوبة</th><th>XP</th><th>إجراءات</th></tr></thead><tbody>
                ${tasks.length === 0 ? '<tr><td colspan="5" class="text-muted text-center">لا توجد مهام — أضف مهمة الآن</td></tr>' :
                tasks.map(t => `<tr><td>${t.id}</td><td>${esc(t.title)}</td><td>${t.difficulty}</td><td>${t.xp}</td>
                  <td><button class="btn btn-danger btn-sm" onclick="deleteContent('task',${t.id})">🗑️</button></td></tr>`).join('')}
              </tbody></table></div>
            </div>
            <div class="card mt-2"><div class="card-title">❓ الاختبارات (${quizzes.length})</div>
              <div class="table-wrap"><table><thead><tr><th>#</th><th>العنوان</th><th>عدد الأسئلة</th><th>إجراءات</th></tr></thead><tbody>
                ${quizzes.length === 0 ? '<tr><td colspan="4" class="text-muted text-center">لا توجد اختبارات — أضف اختباراً الآن</td></tr>' :
                quizzes.map(q => `<tr><td>${q.id}</td><td>${esc(q.title)}</td><td>${q.questions}</td>
                  <td><button class="btn btn-danger btn-sm" onclick="deleteContent('quiz',${q.id})">🗑️</button></td></tr>`).join('')}
              </tbody></table></div>
            </div>
          `;
        }

        /* ═══════════════════════════════════════════════════
           VIEW: ANALYTICS
           ═══════════════════════════════════════════════════ */
        function renderAnalytics() {
            const uCount = Object.keys(allUsers).length;
            const totalXP = Object.values(allUsers).reduce((s, u) => s + (u.xp || 0), 0);
            return `
            <div class="chart-row">
              <div class="card"><div class="card-title">📈 تقدم المستخدمين (XP)</div><div class="chart-box"><canvas id="xpChart"></canvas></div></div>
              <div class="card"><div class="card-title">🧩 توزيع المحتوى</div><div class="chart-box"><canvas id="contentChart"></canvas></div></div>
            </div>
            <div class="card"><div class="card-title">📊 إحصائيات عامة</div>
              <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;text-align:center">
                <div><div class="text-muted">إجمالي XP</div><div style="font-size:28px;font-weight:900">${totalXP}</div></div>
                <div><div class="text-muted">عدد المستخدمين</div><div style="font-size:28px;font-weight:900">${uCount}</div></div>
                <div><div class="text-muted">إجمالي المحتوى</div><div style="font-size:28px;font-weight:900">${allContent.lessons.length+allContent.tasks.length+allContent.quizzes.length}</div></div>
              </div>
            </div>
          `;
        }

        /* ═══════════════════════════════════════════════════
           VIEW: NOTIFICATIONS
           ═══════════════════════════════════════════════════ */
        function renderNotifications() {
            return `
            <div class="card"><div class="card-title">🔔 إرسال إشعار</div>
              <div class="form-group"><label>عنوان الإشعار</label><input id="notifTitle" placeholder="مثل: تحديث جديد" /></div>
              <div class="form-group"><label>الرسالة</label><textarea id="notifBody" placeholder="تفاصيل الإشعار..."></textarea></div>
              <button class="btn" onclick="sendNotification()">📨 إرسال للجميع</button>
            </div>
            <div class="card mt-2"><div class="card-title">📋 الإشعارات السابقة</div>
              <div class="text-muted" style="padding:12px 0">⚡ لا توجد إشعارات مسجلة.</div>
            </div>
          `;
        }

        /* ═══════════════════════════════════════════════════
           VIEW: SETTINGS
           ═══════════════════════════════════════════════════ */
        function renderSettings() {
            return `
            <div class="card"><div class="card-title">⚙️ إعدادات لوحة التحكم</div>
              <div class="form-group"><label>المظهر</label>
                <button class="btn btn-outline" onclick="toggleTheme()">🌓 تبديل المظهر</button>
              </div>
              <button class="btn btn-danger" onclick="if(confirm('حذف كل البيانات؟')){resetAllData()}">🗑️ إعادة تعيين البيانات</button>
            </div>
          `;
        }

        /* ═══════════════════════════════════════════════════
           CHARTS
           ═══════════════════════════════════════════════════ */
        function initCharts() {
            Object.values(chartInstances).forEach(c => c.destroy());
            chartInstances = {};

            const ctx1 = document.getElementById('activityChart')?.getContext('2d');
            if (ctx1) {
                chartInstances.activity = new Chart(ctx1, {
                    type: 'line',
                    data: { labels: ['أحد', 'إثنين', 'ثلاثاء', 'أربعاء', 'خميس', 'جمعة', 'سبت'],
                        datasets: [{ label: 'نشاط', data: [0, 0, 0, 0, 0, 0, 0], borderColor: '#7c5cff',
                            backgroundColor: 'rgba(124,92,255,0.15)', fill: true, tension: 0.3 }] },
                    options: { responsive: true, maintainAspectRatio: false }
                });
            }
            const ctx2 = document.getElementById('levelChart')?.getContext('2d');
            if (ctx2) {
                const levels = [0, 0, 0, 0, 0];
                Object.values(allUsers).forEach(u => { if (u.level >= 1 && u.level <= 5) levels[u.level - 1]++; });
                chartInstances.level = new Chart(ctx2, {
                    type: 'doughnut',
                    data: { labels: ['L1', 'L2', 'L3', 'L4', 'L5'],
                        datasets: [{ data: levels, backgroundColor: ['#ffbf47', '#ff9f47', '#7c5cff', '#5b8cff',
                                '#26d07c'
                            ] }] },
                    options: { responsive: true, maintainAspectRatio: false }
                });
            }
            const ctx3 = document.getElementById('xpChart')?.getContext('2d');
            if (ctx3) {
                const names = Object.values(allUsers).map(u => u.name);
                const xps = Object.values(allUsers).map(u => u.xp || 0);
                chartInstances.xp = new Chart(ctx3, {
                    type: 'bar',
                    data: { labels: names.length ? names : ['لا يوجد'],
                        datasets: [{ label: 'XP', data: names.length ? xps : [0], backgroundColor: '#7c5cff',
                            borderRadius: 6 }] },
                    options: { responsive: true, maintainAspectRatio: false }
                });
            }
            const ctx4 = document.getElementById('contentChart')?.getContext('2d');
            if (ctx4) {
                chartInstances.content = new Chart(ctx4, {
                    type: 'pie',
                    data: { labels: ['دروس', 'مهام', 'اختبارات'],
                        datasets: [{ data: [allContent.lessons.length, allContent.tasks.length, allContent.quizzes
                                .length
                            ], backgroundColor: ['#5b8cff', '#ffbf47', '#26d07c'] }] },
                    options: { responsive: true, maintainAspectRatio: false }
                });
            }
        }

        /* ═══════════════════════════════════════════════════
           ACTIONS — إدارة المستخدمين والمحتوى
           ═══════════════════════════════════════════════════ */

        // ---- Users ----
        window.openAddUserModal = function() {
            openModal(`
            <h2>➕ إضافة مستخدم جديد</h2>
            <div class="form-group"><label>الاسم</label><input id="newUserName" placeholder="أدخل الاسم" /></div>
            <div class="form-group"><label>البريد الإلكتروني</label><input id="newUserEmail" placeholder="example@mail.com" /></div>
            <div class="form-group"><label>المستوى</label><select id="newUserLevel"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></div>
            <button class="btn" onclick="addUser()">💾 حفظ</button>
          `);
        };

        window.addUser = function() {
            const name = $('newUserName')?.value.trim();
            const email = $('newUserEmail')?.value.trim();
            const level = parseInt($('newUserLevel')?.value || 1);
            if (!name || !email) return toast('يرجى ملء جميع الحقول');
            const id = 'user_' + Date.now();
            allUsers[id] = { name, email, xp: 0, level, joined: Date.now() };
            saveData();
            closeModal();
            renderCurrentView();
            toast('✅ تم إضافة المستخدم');
        };

        window.editUser = function(id) {
            const u = allUsers[id];
            if (!u) return;
            openModal(`
            <h2>✏️ تعديل المستخدم</h2>
            <div class="form-group"><label>الاسم</label><input id="editUserName" value="${esc(u.name)}" /></div>
            <div class="form-group"><label>البريد</label><input id="editUserEmail" value="${esc(u.email)}" /></div>
            <div class="form-group"><label>XP</label><input id="editUserXp" type="number" value="${u.xp||0}" /></div>
            <div class="form-group"><label>المستوى</label><select id="editUserLevel">${[1,2,3,4,5].map(n => `<option ${u.level===n?'selected':''}>${n}</option>`).join('')}</select></div>
            <button class="btn" onclick="saveUserEdit('${id}')">💾 حفظ التعديلات</button>
          `);
        };

        window.saveUserEdit = function(id) {
            const name = $('editUserName')?.value.trim();
            const email = $('editUserEmail')?.value.trim();
            const xp = parseInt($('editUserXp')?.value || 0);
            const level = parseInt($('editUserLevel')?.value || 1);
            if (!name || !email) return toast('الاسم والبريد مطلوبان');
            if (allUsers[id]) { allUsers[id].name = name;
                allUsers[id].email = email;
                allUsers[id].xp = xp;
                allUsers[id].level = level;
                saveData();
                closeModal();
                renderCurrentView();
                toast('✅ تم التحديث'); }
        };

        window.deleteUser = function(id) {
            if (!confirm('حذف هذا المستخدم؟')) return;
            delete allUsers[id];
            saveData();
            renderCurrentView();
            toast('🗑️ تم الحذف');
        };

        // ---- Content (مع دعم يوتيوب) ----
        window.openAddContent = function(type) {
            const titleMap = { lesson: 'درس', task: 'مهمة', quiz: 'اختبار' };
            let extraFields = '';
            if (type === 'lesson') {
                extraFields = `
              <div class="form-group"><label>المدة (دقائق)</label><input id="contentDuration" type="number" value="15" /></div>
              <div class="form-group"><label>🎬 رابط فيديو يوتيوب</label><input id="contentVideo" placeholder="https://www.youtube.com/watch?v=..." /></div>
            `;
            } else if (type === 'task') {
                extraFields =
                    `<div class="form-group"><label>مكافأة XP</label><input id="contentXp" type="number" value="30" /></div>`;
            } else if (type === 'quiz') {
                extraFields =
                    `<div class="form-group"><label>عدد الأسئلة</label><input id="contentQuestions" type="number" value="5" /></div>`;
            }
            openModal(`
            <h2>➕ إضافة ${titleMap[type]||'محتوى'}</h2>
            <div class="form-group"><label>العنوان</label><input id="contentTitle" placeholder="أدخل العنوان" /></div>
            <div class="form-group"><label>الصعوبة</label><select id="contentDiff"><option>Easy</option><option>Medium</option><option>Hard</option></select></div>
            ${extraFields}
            <button class="btn" onclick="addContent('${type}')">💾 حفظ</button>
          `);
        };

        window.addContent = function(type) {
            const title = $('contentTitle')?.value.trim();
            if (!title) return toast('العنوان مطلوب');
            const diff = $('contentDiff')?.value || 'Easy';
            const newItem = { id: Date.now(), title, difficulty: diff };

            if (type === 'lesson') {
                newItem.duration = parseInt($('contentDuration')?.value || 15);
                newItem.videoUrl = $('contentVideo')?.value.trim() || '';
                allContent.lessons.push(newItem);
            } else if (type === 'task') {
                newItem.xp = parseInt($('contentXp')?.value || 30);
                allContent.tasks.push(newItem);
            } else if (type === 'quiz') {
                newItem.questions = parseInt($('contentQuestions')?.value || 5);
                allContent.quizzes.push(newItem);
            }
            saveData();
            closeModal();
            renderCurrentView();
            toast(`✅ تم إضافة ${type}`);
        };

        window.deleteContent = function(type, id) {
            if (!confirm('حذف هذا المحتوى؟')) return;
            if (type === 'lesson') allContent.lessons = allContent.lessons.filter(l => l.id !== id);
            else if (type === 'task') allContent.tasks = allContent.tasks.filter(t => t.id !== id);
            else if (type === 'quiz') allContent.quizzes = allContent.quizzes.filter(q => q.id !== id);
            saveData();
            renderCurrentView();
            toast('🗑️ تم الحذف');
        };

        // ---- Notifications ----
        window.sendNotification = function() {
            const title = $('notifTitle')?.value.trim();
            const body = $('notifBody')?.value.trim();
            if (!title || !body) return toast('يرجى ملء الحقول');
            toast(`📨 تم إرسال الإشعار: "${title}"`);
            $('notifTitle').value = '';
            $('notifBody').value = '';
        };

        // ---- Settings ----
        window.toggleTheme = function() {
            document.body.classList.toggle('light');
            localStorage.setItem('adminTheme', document.body.classList.contains('light') ? 'light' : 'dark');
        };

        window.resetAllData = function() {
            if (!confirm('هل أنت متأكد؟ سيتم حذف كل البيانات نهائياً!')) return;
            allUsers = {};
            allContent = { lessons: [], tasks: [], quizzes: [] };
            saveData();
            renderCurrentView();
            toast('♻️ تم إعادة التعيين');
        };

        /* ═══════════════════════════════════════════════════
           NAVIGATION & EVENTS
           ═══════════════════════════════════════════════════ */
        document.addEventListener('DOMContentLoaded', function() {
            if (localStorage.getItem('adminTheme') === 'light') document.body.classList.add('light');

            qsa('.nav-item').forEach(btn => {
                btn.addEventListener('click', function() {
                    const view = this.dataset.view;
                    if (view) { currentView = view;
                        renderCurrentView(); if (window.innerWidth <= 900) $('sidebar').classList.remove(
                            'open'); }
                });
            });

            $('logoutBtn').addEventListener('click', function() {
                if (firebaseReady && firebase.auth().currentUser) {
                    firebase.auth().signOut().then(() => { toast('تم تسجيل الخروج');
                        location.reload(); });
                } else { toast('⚠️ وضع غير متصل، إعادة تحميل');
                    location.reload(); }
            });

            $('themeToggle').addEventListener('click', toggleTheme);
            $('menuToggle').addEventListener('click', function() { $('sidebar').classList.toggle('open'); });
            $('modalClose').addEventListener('click', closeModal);
            $('modalOverlay').addEventListener('click', function(e) { if (e.target === this) closeModal(); });

            const ok = initFirebase();
            if (ok) signInAnonymously();
            else fallbackLocal();

            currentView = 'dashboard';
            renderCurrentView();
        });

        let resizeTimer;
        window.addEventListener('resize', function() {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => { if (['analytics', 'dashboard'].includes(currentView)) initCharts(); },
            300);
        });

        // Expose for inline
        window.renderCurrentView = renderCurrentView;
        window.closeModal = closeModal;
        window.toast = toast;
    </script>
</body>
</html>
