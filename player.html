<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>تشغيل الفيديو - منصة THE BEST</title>
<link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
<style>
  body {
    font-family: 'Cairo', sans-serif;
    background: #0a0a0a;
    color: #fff;
    margin: 0;
    text-align: center;
  }
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #111;
    padding: 14px 18px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .title { color: #ffd700; font-weight: 700; font-size: 18px; }
  .back { font-size: 22px; cursor: pointer; color: #ffd700; user-select: none; }
  .back:hover { transform: translateX(-5px); }
  #player { max-width: 950px; width: 100%; height: 60vh; margin: 25px auto; border-radius: 18px; background: #000; }
  #hint { margin-top: 12px; color: #ffd700; font-size: 14px; }
  .error-msg { margin: 40px auto; color: #ff4d4d; font-size: 20px; font-weight: 700; }
</style>
</head>
<body>

<div class="topbar">
  <div class="back" onclick="history.back()">⬅</div>
  <div class="title">تشغيل الفيديو 🎬</div>
  <div style="width:25px;"></div>
</div>

<video id="player" playsinline controls poster="poster.jpg"></video>
<div id="hint">💡 اسحب الفيديو لتقديمه أو تأخيره على الهاتف</div>

<script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<script>
const player = new Plyr('#player', {
  controls: ['play-large','play','rewind','fast-forward','progress','current-time','duration','mute','volume','fullscreen'],
  rewindTime: 10,
  forwardTime: 10
});

// جلب البيانات من localStorage
let videoTitle = localStorage.getItem("video_title") || "Lecture Video";
let savedSources = JSON.parse(localStorage.getItem("video_sources") || "[]");

if (!savedSources || savedSources.length === 0) {
  document.body.innerHTML = "<div class='error-msg'>لم يتم تحديد رابط الفيديو 😢</div>";
} else {
  // نختار المصدر الأول لتشغيله
  let firstSrc = typeof savedSources[0] === "string" ? savedSources[0] : savedSources[0].src;

  if (firstSrc.endsWith(".m3u8") && Hls.isSupported()) {
    const hls = new Hls();
    hls.loadSource(firstSrc);
    hls.attachMedia(document.getElementById('player'));
  } else {
    player.source = {
      type: 'video',
      title: videoTitle,
      sources: savedSources.map(src => ({
        src: typeof src === "string" ? src : src.src,
        type: "application/x-mpegURL"
      }))
    };
  }
}

// Fullscreen تلقائي وتدوير عند التشغيل
player.on('play', async () => {
  try {
    if (!player.fullscreen.active) player.fullscreen.enter();
    if (screen.orientation && screen.orientation.lock) {
      await screen.orientation.lock('landscape');
    }
  } catch (err) { console.warn("⚠️ لا يمكن تفعيل التدوير التلقائي:", err); }
});

// رسالة تلميحية مخفية بعد 5 ثواني
setTimeout(() => document.getElementById('hint').style.display = 'none', 5000);
</script>

</body>
</html>
