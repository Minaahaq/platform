<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>تشغيل الفيديو - منصة THE BEST</title>
<link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');

  body {
    font-family: 'Cairo', sans-serif;
    background: radial-gradient(circle at top, #0a0a0a, #000);
    color: #fff;
    margin: 0;
    text-align: center;
    overflow-x: hidden;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #111;
    padding: 14px 18px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 0 10px rgba(255, 215, 0, 0.1);
  }
  .title {
    color: #ffd700;
    font-weight: 700;
    font-size: 18px;
    text-shadow: 0 0 8px #ffd700;
  }
  .back {
    font-size: 22px;
    cursor: pointer;
    color: #ffd700;
    transition: transform 0.3s;
    user-select: none;
  }
  .back:hover { transform: translateX(-5px); }

  #player {
    max-width: 950px;
    width: 100%;
    height: 60vh;
    border-radius: 18px;
    margin: 25px auto;
    box-shadow: 0 0 20px rgba(255, 215, 0, 0.2);
    background: #000;
  }

  .control-buttons {
    margin: 15px auto;
    display: flex;
    justify-content: center;
    gap: 15px;
  }
  .control-buttons button {
    padding: 10px 14px;
    font-size: 16px;
    font-weight: bold;
    border: none;
    border-radius: 8px;
    background: #ffd700;
    color: #000;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(255,215,0,0.3);
    transition: transform 0.2s;
  }
  .control-buttons button:hover {
    transform: translateY(-3px);
  }

  .error-msg {
    margin: 40px auto;
    color: #ff4d4d;
    font-size: 20px;
    font-weight: 700;
    text-shadow: 0 0 8px #ff0000;
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="back" onclick="history.back()">⬅</div>
  <div class="title">𝑷𝒍𝒂𝒚 𝑽𝒊𝒅𝒆𝒐 🎬</div>
  <div style="width:25px;"></div>
</div>

<video id="player" playsinline controls></video>

<div class="control-buttons">
  <button id="rewind10">⏪ -10s</button>
  <button id="forward10">⏩ +10s</button>
</div>

<script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<script>
let qualitySources = [];
let videoTitle = localStorage.getItem("video_title") || "Lecture Video";
const savedSources = localStorage.getItem("video_sources");

if (savedSources) {
  try {
    const links = JSON.parse(savedSources);
    if (Array.isArray(links)) {
      qualitySources = links.map(link => ({
        src: link.url || link,
        type: "application/x-mpegURL",
        size: parseInt(link.label) || 720
      }));
    } else {
      qualitySources = [{
        src: links.url || links,
        type: "application/x-mpegURL",
        size: parseInt(links.label) || 720
      }];
    }
  } catch (err) {
    console.error("❌ Error parsing savedSources:", err);
  }
} else {
  document.body.innerHTML = "<div class='error-msg'>لم يتم تحديد رابط الفيديو 😢</div>";
}

const player = new Plyr('#player', {
  controls: [
    'play-large','play','progress','current-time',
    'mute','volume','settings','fullscreen'
  ],
  settings: ['quality','speed','loop']
});

// تشغيل HLS إذا كان الفيديو بصيغة m3u8
if (qualitySources.length > 0) {
  const firstSrc = qualitySources[0].src;
  if (firstSrc.endsWith(".m3u8") && Hls.isSupported()) {
    const hls = new Hls();
    hls.loadSource(firstSrc);
    hls.attachMedia(document.getElementById('player'));
  } else {
    player.source = {
      type: 'video',
      title: videoTitle,
      sources: qualitySources
    };
  }
}

// ⏪ + ⏩ تقديم/تأخير الفيديو
document.getElementById('rewind10').addEventListener('click', () => {
  player.currentTime = Math.max(player.currentTime - 10, 0);
});
document.getElementById('forward10').addEventListener('click', () => {
  player.currentTime = Math.min(player.currentTime + 10, player.duration);
});
</script>

</body>
</html>
