<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premium Video Player</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
:root{
  --neon:#00f5c4;
}

*{box-sizing:border-box}
body{
  margin:0;
  font-family:'Cairo',sans-serif;
  background:#000;
  overflow:hidden;
  color:#fff;
}

/* ===== Player ===== */
.player-box{
  width:95%;
  max-width:1000px;
  aspect-ratio:16/9;
  margin:80px auto;
  position:relative;
  background:#000;
  border-radius:20px;
  overflow:hidden;
  box-shadow:0 0 40px rgba(0,245,196,.25);
}

/* ===== Video ===== */
video{
  width:100%;
  height:100%;
  object-fit:contain;
  cursor:pointer;
}

/* ===== Top Overlay ===== */
.topbar{
  position:absolute;
  top:0;left:0;right:0;
  height:60px;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:10;
  pointer-events:none;
  background:linear-gradient(to bottom,rgba(0,0,0,.7),transparent);
}

.topbar .title{
  font-weight:800;
  color:var(--neon);
  text-shadow:0 0 12px var(--neon);
  background:rgba(0,0,0,.4);
  padding:6px 18px;
  border-radius:14px;
  backdrop-filter:blur(6px);
}

.back{
  position:absolute;
  left:16px;
  pointer-events:auto;
  cursor:pointer;
  padding:6px 12px;
  border-radius:10px;
  background:rgba(0,0,0,.4);
  transition:.3s;
}
.back:hover{background:var(--neon);color:#000}

/* ===== Center Play ===== */
.center-play{
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  font-size:90px;
  color:var(--neon);
  text-shadow:0 0 35px var(--neon);
  opacity:0;
  pointer-events:none;
  transition:.3s;
}
.player-box.paused .center-play{opacity:1}

/* ===== Controls ===== */
.controls{
  position:absolute;
  bottom:12px;
  left:12px;
  right:12px;
  background:rgba(0,0,0,.55);
  backdrop-filter:blur(14px);
  border-radius:18px;
  padding:14px;
  display:flex;
  flex-direction:column;
  gap:10px;
  opacity:0;
  transform:translateY(20px);
  transition:.3s;
}
.player-box.show .controls{
  opacity:1;
  transform:none;
}

/* ===== Progress ===== */
.progress{
  height:5px;
  background:rgba(255,255,255,.25);
  border-radius:10px;
  cursor:pointer;
  position:relative;
  transition:.2s;
}
.progress:hover{height:8px}
.bar{
  height:100%;
  width:0%;
  background:var(--neon);
  border-radius:10px;
  box-shadow:0 0 12px var(--neon);
}

/* ===== Buttons ===== */
.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.group{display:flex;gap:12px;align-items:center}

button{
  background:rgba(255,255,255,.1);
  border:none;
  color:#fff;
  font-size:1.1rem;
  padding:6px 12px;
  border-radius:12px;
  cursor:pointer;
  transition:.25s cubic-bezier(.4,2,.6,1);
}
button:hover{
  background:var(--neon);
  color:#000;
  box-shadow:0 0 14px var(--neon);
}

.time{
  font-family:monospace;
  font-size:.9rem;
  opacity:.9;
}

/* ===== Speed Menu ===== */
.speed-menu{
  position:absolute;
  bottom:85px;
  left:20px;
  background:rgba(0,0,0,.85);
  border:1px solid rgba(0,245,196,.4);
  border-radius:14px;
  display:none;
  overflow:hidden;
}
.speed-menu button{width:100%;background:none}
.speed-menu.active{display:block}

/* ===== Pause Blur ===== */
.player-box.paused video{
  filter:blur(2px) brightness(.85);
}
</style>
</head>

<body>

<div class="player-box paused show" id="box">

  <div class="topbar">
    <div class="back" onclick="history.back()">⬅</div>
    <div class="title" id="videoTitle">Lecture Video</div>
  </div>

  <video id="video" playsinline></video>
  <div class="center-play">▶</div>

  <div class="controls">
    <div class="progress" id="progress">
      <div class="bar" id="bar"></div>
    </div>

    <div class="row">
      <div class="group">
        <button id="playBtn">⏯</button>
        <button onclick="skip(-10)">⏪</button>
        <button onclick="skip(10)">⏩</button>
        <span class="time" id="time">00:00 / 00:00</span>
      </div>

      <div class="group">
        <button id="speedBtn">⚡</button>
        <button id="fsBtn">⛶</button>
      </div>
    </div>

    <div class="speed-menu" id="speedMenu">
      <button onclick="setSpeed(.5)">0.5x</button>
      <button onclick="setSpeed(1)">1x</button>
      <button onclick="setSpeed(1.5)">1.5x</button>
      <button onclick="setSpeed(2)">2x</button>
    </div>
  </div>

</div>

<script>
const video=document.getElementById("video"),
box=document.getElementById("box"),
bar=document.getElementById("bar"),
progress=document.getElementById("progress"),
timeTxt=document.getElementById("time"),
playBtn=document.getElementById("playBtn"),
speedMenu=document.getElementById("speedMenu");

const title=localStorage.getItem("video_title")||"Lecture Video";
document.getElementById("videoTitle").innerText=title;

const src=localStorage.getItem("video_src")||
"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8";

if(src.endsWith(".m3u8")&&Hls.isSupported()){
  const hls=new Hls();
  hls.loadSource(src);
  hls.attachMedia(video);
}else video.src=src;

function toggle(){
  video.paused?video.play():video.pause();
}
video.onclick=toggle;
playBtn.onclick=toggle;

video.addEventListener("play",()=>box.classList.remove("paused"));
video.addEventListener("pause",()=>box.classList.add("paused"));

video.addEventListener("timeupdate",()=>{
  if(video.duration){
    bar.style.width=(video.currentTime/video.duration*100)+"%";
    timeTxt.textContent=format(video.currentTime)+" / "+format(video.duration);
  }
});

function format(t){
  const m=Math.floor(t/60),s=Math.floor(t%60);
  return `${m.toString().padStart(2,"0")}:${s.toString().padStart(2,"0")}`;
}

progress.onclick=e=>{
  const r=progress.getBoundingClientRect();
  video.currentTime=(e.clientX-r.left)/r.width*video.duration;
};

window.skip=s=>video.currentTime+=s;

speedBtn.onclick=e=>{
  e.stopPropagation();
  speedMenu.classList.toggle("active");
};
window.setSpeed=s=>{
  video.playbackRate=s;
  speedMenu.classList.remove("active");
};
document.addEventListener("click",()=>speedMenu.classList.remove("active"));

fsBtn.onclick=()=>{
  !document.fullscreenElement?box.requestFullscreen():document.exitFullscreen();
};

box.onmousemove=()=>box.classList.add("show");
</script>

</body>
</html>
