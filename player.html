<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>مشغل الفيديو</title>

<!-- Plyr CSS -->
<link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css"/>
<style>
  body {
    background: #111;
    margin: 0;
    padding: 20px;
    font-family: "Cairo", sans-serif;
    color: white;
  }

  .title {
    font-size: 22px;
    margin-bottom: 10px;
  }

  video {
    width: 100%;
    border-radius: 12px;
    overflow: hidden;
  }
</style>
</head>
<body>

<div class="title" id="video-title">LOADING...</div>

<video id="player" controls playsinline></video>

<!-- Plyr + HLS -->
<script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<script>
  // قراءة اختيار المستخدم من صفحة الجودات
  const sources = JSON.parse(localStorage.getItem("video_sources"));
  const videoTitle = localStorage.getItem("video_title");

  document.getElementById("video-title").textContent = videoTitle || "Video";

  const video = document.getElementById("player");

  // رابط الفيديو من السيرفر الحقيقي → نعدّله ليشتغل عبر البروكسي
  const finalURL = `/api/proxy?url=${encodeURIComponent(sources.url)}`;

  // تشغيل الفيديو
  if (Hls.isSupported()) {
      const hls = new Hls();
      hls.loadSource(finalURL);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, function () {
          video.play();
      });
  } else {
      video.src = finalURL;
  }

  // تفعيل مشغل Plyr
  const player = new Plyr('#player');
</script>

</body>
</html>
