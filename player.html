<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Video Player | THE BEST</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
:root{
  --neon:#00F5C4;
}
body{
  margin:0;
  background:#000;
  font-family:'Cairo',sans-serif;
  color:#fff;
  display:flex;
  flex-direction:column;
  align-items:center;
  min-height:100vh;
}
.topbar{
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 18px;
  background:linear-gradient(to bottom,rgba(0,0,0,.9),transparent);
}
.back{
  cursor:pointer;
  font-size:20px;
}
.title{
  color:var(--neon);
  font-weight:800;
}
.player-box{
  width:95%;
  max-width:1000px;
  aspect-ratio:16/9;
  background:#000;
  margin-top:20px;
  position:relative;
  box-shadow:0 0 40px rgba(0,245,196,.15);
}
video{
  width:100%;
  height:100%;
  object-fit:contain;
  cursor:pointer;
}
.controls{
  position:absolute;
  bottom:0;left:0;right:0;
  background:linear-gradient(transparent,rgba(0,0,0,.95));
  padding:18px;
  display:flex;
  flex-direction:column;
  gap:10px;
  opacity:0;
  transform:translateY(15px);
  transition:.3s;
  pointer-events:none;
}
.show .controls{
  opacity:1;
  transform:translateY(0);
  pointer-events:auto;
}
.progress{
  height:6px;
  background:rgba(255,255,255,.2);
  border-radius:10px;
  cursor:pointer;
  position:relative;
}
.bar{
  height:100%;
  width:0%;
  background:var(--neon);
  border-radius:10px;
  position:absolute;
  right:0;
}
.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.group{
  display:flex;
  gap:12px;
  align-items:center;
}
button{
  background:none;
  border:none;
  font-size:1.2rem;
  color:white;
  cursor:pointer;
}
button:hover{color:var(--neon);}
.time{font-size:.9rem;opacity:.9;}
.speed-menu{
  position:absolute;
  bottom:80px;
  left:20px;
  background:rgba(0,0,0,.9);
  border:1px solid rgba(0,245,196,.35);
  border-radius:10px;
  display:none;
}
.speed-menu.active{display:block;}
.speed-menu button{
  display:block;
  width:100%;
  padding:8px 14px;
}
</style>
</head>

<body class="show">

<div class="topbar">
  <div class="back" onclick="history.back()">⬅</div>
  <div class="title" id="videoTitle">جاري التحميل…</div>
  <div style="width:24px"></div>
</div>

<div class="player-box" id="box">
  <video id="player" playsinline></video>

  <div class="controls" id="controls">
    <div class="progress" id="progress">
      <div class="bar" id="bar"></div>
    </div>

    <div class="row">
      <div class="group">
        <button id="playBtn">⏯</button>
        <button onclick="skip(-10)">⏪ 10s</button>
        <button onclick="skip(10)">⏩ 10s</button>
        <span class="time" id="time">00:00 / 00:00</span>
      </div>

      <div class="group">
        <button id="speedBtn">⚡</button>
        <button id="fsBtn">⛶</button>
      </div>
    </div>

    <div class="speed-menu" id="speedMenu">
      <button onclick="setSpeed(0.5)">0.5x</button>
      <button onclick="setSpeed(1)">عادي</button>
      <button onclick="setSpeed(1.5)">1.5x</button>
      <button onclick="setSpeed(2)">2x</button>
    </div>
  </div>
</div>

<script>
const video = document.getElementById("player");
const box = document.getElementById("box");
const progress = document.getElementById("progress");
const bar = document.getElementById("bar");
const playBtn = document.getElementById("playBtn");
const timeTxt = document.getElementById("time");
const speedMenu = document.getElementById("speedMenu");
const fsBtn = document.getElementById("fsBtn");

let hideTimer;

// ===== عنوان الفيديو =====
const videoTitle = localStorage.getItem("video_title") || "Lecture Video";
document.getElementById("videoTitle").innerText = videoTitle;

// ===== قراءة المصادر من localStorage =====
let qualitySources = [];
const savedSources = localStorage.getItem("video_sources");

if (savedSources) {
  try {
    const videoData = JSON.parse(savedSources);
    if (Array.isArray(videoData)) {
      qualitySources = videoData.map(v => ({
        src: v.stream_url || v.src || v,
        type: v.src?.endsWith(".m3u8") || v.stream_url?.endsWith(".m3u8") ? "application/x-mpegURL" : "video/mp4",
        size: parseInt(v.label) || 720
      }));
    } else {
      qualitySources = [{
        src: videoData.stream_url || videoData.src || videoData,
        type: videoData.src?.endsWith(".m3u8") || videoData.stream_url?.endsWith(".m3u8") ? "application/x-mpegURL" : "video/mp4",
        size: parseInt(videoData.label) || 720
      }];
    }
  } catch (err) {
    console.error("❌ Error parsing savedSources:", err);
  }
} else {
  alert("لم يتم تحديد رابط الفيديو 😢");
}

// ===== تشغيل HLS أو MP4 =====
if (qualitySources.length > 0) {
  const firstSrc = qualitySources[0].src;
  if (firstSrc.endsWith(".m3u8")) {
    if (Hls.isSupported()) {
      const hls = new Hls();
      hls.loadSource(firstSrc);
      hls.attachMedia(video);
    } else if (video.canPlayType("application/vnd.apple.mpegURL")) {
      video.src = firstSrc; // Safari / iOS
    } else {
      alert("متصفحك لا يدعم تشغيل HLS");
    }
  } else {
    video.src = firstSrc; // MP4
  }
}

// ===== UI show/hide =====
function showUI() {
  document.body.classList.add("show");
  clearTimeout(hideTimer);
  if (!video.paused) {
    hideTimer = setTimeout(() => document.body.classList.remove("show"), 3000);
  }
}
box.addEventListener("mousemove", showUI);
box.addEventListener("click", showUI);

// ===== Play/Pause =====
function togglePlay() {
  if (video.paused) { video.play(); playBtn.textContent = "⏸"; }
  else { video.pause(); playBtn.textContent = "▶"; }
  showUI();
}
playBtn.onclick = togglePlay;
video.onclick = togglePlay;

// ===== Time & Progress =====
function fmt(t){
  const h = Math.floor(t/3600);
  const m = Math.floor((t%3600)/60);
  const s = Math.floor(t%60);
  return (h>0 ? h+":" : "") + `${m.toString().padStart(2,"0")}:${s.toString().padStart(2,"0")}`;
}
video.addEventListener("timeupdate", () => {
  if (video.duration) {
    bar.style.width = (video.currentTime / video.duration * 100) + "%";
    timeTxt.textContent = `${fmt(video.currentTime)} / ${fmt(video.duration)}`;
  }
});

// ===== Seek =====
progress.onclick = e => {
  const r = progress.getBoundingClientRect();
  const x = e.clientX - r.left;
  video.currentTime = (x / r.width) * video.duration;
};

// ===== Skip =====
window.skip = v => { video.currentTime += v; showUI(); };

// ===== Speed =====
document.getElementById("speedBtn").onclick = e => {
  e.stopPropagation();
  speedMenu.classList.toggle("active");
};
window.setSpeed = s => { video.playbackRate = s; speedMenu.classList.remove("active"); };
document.addEventListener("click", () => speedMenu.classList.remove("active"));

// ===== Fullscreen =====
function toggleFS() {
  if (!document.fullscreenElement) box.requestFullscreen();
  else document.exitFullscreen();
}
fsBtn.onclick = toggleFS;

// ===== Keyboard shortcuts =====
document.addEventListener("keydown", e => {
  showUI();
  if (e.code === "Space") { e.preventDefault(); togglePlay(); }
  if (e.code === "ArrowRight") skip(10);
  if (e.code === "ArrowLeft") skip(-10);
  if (e.code === "KeyF") toggleFS();
});

// ===== Auto fullscreen & landscape (optional) =====
video.addEventListener("play", async () => {
  try {
    if (!document.fullscreenElement) box.requestFullscreen();
    if (screen.orientation?.lock) {
      await screen.orientation.lock('landscape');
    }
  } catch(e) { console.warn(e); }
});
</script>


</body>
</html>
