<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1020">
<title>MINA CODE ACADEMY</title>
<style>
:root{--bg:#070b14;--panel:#101827;--panel2:#151f31;--text:#f7f9ff;--muted:#9ba8c0;--line:#26334d;--p:#7c5cff;--p2:#00d4ff;--ok:#2bd67b;--bad:#ff5f75;--warn:#ffc14d;--shadow:0 20px 60px #0008}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#1b2750,transparent 35%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Tahoma,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.top{height:70px;position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;padding:0 16px;background:#0a1020dd;backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}.brand{font-weight:900;white-space:nowrap}.brand b{color:#a594ff}.brand small{display:block;color:var(--muted);font-size:9px;letter-spacing:2px}.search{position:relative;flex:1;max-width:550px;margin:auto}.search input{width:100%;padding:11px 40px 11px 12px;background:var(--panel);border:1px solid var(--line);border-radius:13px;color:var(--text);outline:none}.search>span{position:absolute;right:13px;top:10px;color:var(--muted)}.results{display:none;position:absolute;top:51px;right:0;left:0;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:7px;box-shadow:var(--shadow);z-index:100}.result{padding:10px;border-radius:9px}.result:hover{background:#ffffff0b}.actions{display:flex;gap:7px;align-items:center}.icon,.avatar{width:40px;height:40px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:12px}.avatar{border:0;border-radius:50%;background:linear-gradient(135deg,var(--p),var(--p2));font-weight:900}.layout{display:flex}.side{width:245px;position:fixed;top:70px;bottom:0;right:0;padding:15px 12px;background:#0a1020ee;border-left:1px solid var(--line);overflow:auto}.main{width:calc(100% - 245px);margin-right:245px;padding:25px;max-width:1500px;margin-left:auto}.nav{width:100%;border:0;background:transparent;color:var(--muted);padding:12px;border-radius:11px;text-align:right;margin:2px 0}.nav:hover,.nav.active{color:#fff;background:linear-gradient(90deg,#7c5cff25,transparent)}.section{margin-top:22px}.hero{padding:28px;border:1px solid var(--line);border-radius:23px;background:linear-gradient(135deg,#151e34,#0d1423);box-shadow:var(--shadow);display:flex;justify-content:space-between;gap:25px}.hero h1{font-size:clamp(28px,4vw,44px);margin:8px 0}.muted{color:var(--muted)}.eyebrow{color:#aa98ff;font-size:12px;font-weight:800;letter-spacing:.6px}.btn{border:0;padding:11px 16px;border-radius:12px;color:#fff;background:linear-gradient(135deg,var(--p),#5e8cff);font-weight:800}.btn.secondary{background:var(--panel2);border:1px solid var(--line)}.btn.ok{background:var(--ok);color:#04150b}.grid{display:grid;gap:15px}.stats{grid-template-columns:repeat(5,1fr);margin:18px 0}.card{background:linear-gradient(145deg,#111a2b,#0d1422);border:1px solid var(--line);border-radius:17px;padding:17px;box-shadow:0 10px 35px #0003}.stat .value{font-size:25px;font-weight:900;margin-top:5px}.stat .label{font-size:12px;color:var(--muted)}.coursegrid{grid-template-columns:repeat(3,1fr)}.courseicon{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;background:#7c5cff22;font-size:26px}.course h3{margin:13px 0 6px}.course p{color:var(--muted);line-height:1.7;min-height:48px;font-size:13px}.tags{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.tag,.pill{display:inline-block;border:1px solid var(--line);background:#ffffff08;color:var(--muted);font-size:11px;padding:5px 8px;border-radius:99px}.pill.ok{color:var(--ok);background:#2bd67b16}.pill.warn{color:var(--warn);background:#ffc14d16}.pill.bad{color:var(--bad);background:#ff5f7516}.progress{height:8px;background:#263149;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--p),var(--p2));transition:.6s}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:13px}.sectionhead h1,.sectionhead h2{margin:0}.list{display:grid;gap:9px}.row{display:flex;align-items:center;gap:12px;padding:13px;background:#0b1220;border:1px solid var(--line);border-radius:13px}.grow{flex:1}.num{width:35px;height:35px;display:grid;place-items:center;border-radius:10px;background:#ffffff08}.done .num{background:#2bd67b1a;color:var(--ok)}.lessonlayout{display:grid;grid-template-columns:275px 1fr;gap:15px}.sticky{position:sticky;top:88px;height:max-content}.video{height:285px;border-radius:17px;border:1px solid var(--line);display:grid;place-items:center;background:radial-gradient(circle,#1d2c59,#080d17);margin:15px 0}.play{width:70px;height:70px;border-radius:50%;display:grid;place-items:center;background:var(--p);font-size:25px}.code{direction:ltr;text-align:left;border:1px solid #2a3752;border-radius:13px;overflow:auto;background:#060a12;margin:12px 0}.codehead{display:flex;justify-content:space-between;padding:8px 11px;color:#8795b1;background:#0d1421;border-bottom:1px solid var(--line)}pre{margin:0;padding:15px;color:#dbe5ff;font:14px/1.7 monospace}.editor,.output{width:100%;direction:ltr;text-align:left;border-radius:13px;border:1px solid #2a3752;background:#060a12;color:#dce6ff;padding:15px;font:14px/1.7 monospace}.editor{min-height:280px;resize:vertical;outline:none}.output{min-height:90px;white-space:pre-wrap}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;background:#0b1220;color:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;outline:none}.field textarea{min-height:110px;resize:vertical}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:12px;border-bottom:1px solid var(--line);text-align:right}.table th{color:var(--muted);font-size:12px}.badgegrid{grid-template-columns:repeat(3,1fr)}.badge{display:flex;align-items:center;gap:12px}.badgeicon{font-size:30px;width:55px;height:55px;display:grid;place-items:center;border-radius:14px;background:#ffffff08}.locked{opacity:.5}.chart{height:190px;display:flex;align-items:end;gap:12px;padding:18px}.bar{flex:1;background:linear-gradient(var(--p),var(--p2));border-radius:7px 7px 2px 2px}.toastbox{position:fixed;bottom:18px;left:18px;z-index:200;display:grid;gap:8px}.toast{padding:12px 15px;background:#151e30;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);animation:up .25s}.modal{display:none;position:fixed;inset:0;background:#0009;z-index:150;align-items:center;justify-content:center;padding:18px}.modal.show{display:flex}.modalbox{width:min(720px,100%);max-height:90vh;overflow:auto;background:#101827;border:1px solid var(--line);border-radius:20px;padding:20px}.close{float:left;background:transparent;color:#fff;border:0;font-size:24px}.bottom{display:none}@keyframes up{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}@media(max-width:1050px){.stats{grid-template-columns:repeat(3,1fr)}.coursegrid{grid-template-columns:1fr 1fr}}@media(max-width:760px){.top{height:64px}.search{display:none}.side{display:none}.main{width:100%;margin:0;padding:15px 12px 82px}.stats{grid-template-columns:1fr 1fr}.stat:last-child{grid-column:span 2}.coursegrid,.badgegrid{grid-template-columns:1fr}.hero{display:block;padding:20px}.lessonlayout{grid-template-columns:1fr}.sticky{position:static}.video{height:210px}.formgrid{grid-template-columns:1fr}.bottom{display:flex;position:fixed;z-index:90;bottom:0;right:0;left:0;height:65px;background:#0a1020ee;border-top:1px solid var(--line);justify-content:space-around}.bottom button{background:transparent;border:0;color:var(--muted);font-size:10px}.bottom b{display:block;font-size:18px}}
.light{--bg:#f4f6fb;--panel:#fff;--panel2:#eef1f8;--text:#111827;--muted:#647087;--line:#dce3ef}.light .top,.light .side{background:#ffffffee}.light .card{background:#fff}.light .field input,.light .field textarea,.light .field select{background:#fff;color:#111}
</style>
</head>
<body>
<div id="app"></div><div id="toastbox" class="toastbox"></div>
<div id="modal" class="modal"><div class="modalbox"><button class="close" onclick="closeModal()">×</button><div id="modalbody"></div></div></div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,onAuthStateChanged,signInAnonymously,updateProfile}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getDatabase,ref,get,set,update,onValue,push}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

/* ================= CONFIG ================= */
const firebaseConfig={
 apiKey:"AIzaSyB0p0us6BuzD2ngzjhRnmUIhlOcBeRp0vQ",
 authDomain:"tok-tak-d6e17.firebaseapp.com",
 databaseURL:"https://tok-tak-d6e17-default-rtdb.firebaseio.com",
 projectId:"tok-tak-d6e17",
 storageBucket:"tok-tak-d6e17.appspot.com",
 messagingSenderId:"547062578826",
 appId:"1:547062578826:web:aa285cf798341be07cb773",
 measurementId:"G-7EMKEQKPVV"
};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getDatabase(app);

/* ================= DATA ================= */
const courses=[
{id:1,name:"أساسيات البرمجة",icon:"💻",desc:"ابدأ من الصفر وتعلم التفكير البرمجي خطوة بخطوة.",difficulty:"Beginner"},
{id:2,name:"Python Fundamentals",icon:"🐍",desc:"أساسيات Python والمتغيرات والشروط والحلقات والدوال.",difficulty:"Beginner"},
{id:3,name:"Problem Solving",icon:"🧠",desc:"طور طريقة تفكيرك وحل المسائل البرمجية.",difficulty:"Intermediate"}];
const lessons=Array.from({length:30},(_,i)=>({id:i+1,course:Math.floor(i/10)+1,title:["مقدمة في البرمجة","Variables","Data Types","Operators","Conditions","Loops","Functions","Lists","Maps","Mini Project"][i%10],duration:8+i%6,code:i%2?'let total = 10 + 20;\\nconsole.log(total);':'const name = "Mina";\\nconsole.log(name);'}));
const tasks=Array.from({length:20},(_,i)=>({id:i+1,title:["احسب مجموع رقمين","حدد الرقم الأكبر","احسب متوسط الدرجات","اعكس نصًا","ابحث عن عنصر"][i%5],difficulty:["Easy","Medium","Hard"][i%3],xp:20+(i%3)*10,desc:"اكتب حلًا للمشكلة واختبره على الحالات المعطاة.",starter:'console.log("Mina");'}));
const quizzes=Array.from({length:30},(_,i)=>({id:i+1,question:"ما ناتج الكود التالي؟",code:"console.log(2 + 3);",options:["2","3","5","23"],correct:2,explanation:"2 + 3 تساوي 5.",xp:20}));
const badges=[["🎯","First Lesson","أكملت أول درس"],["💻","First Code","شغلت أول كود"],["🔥","7 Days Streak","حافظت على 7 أيام"],["🏆","10 Tasks","أكملت 10 مهام"],["🚀","1000 XP","وصلت إلى 1000 XP"],["🧠","Problem Solver","حللت تحديات"],["📚","Course Starter","بدأت كورس"],["⚡","Fast Learner","تعلمت بسرعة"],["🔬","Code Explorer","جربت Code Lab"],["👑","Code Master","أسطورة الكود"]];
const demoStudents=[["Mina",1240,4,18],["Ahmed",1120,4,16],["Gamal",980,3,15],["John",850,3,12],["Sara",720,2,10]];

/* ================= STATE ================= */
const defaults={studentName:"Mina",theme:"dark",xp:1240,level:4,completedLessons:Array.from({length:18},(_,i)=>i+1),completedTasks:Array.from({length:18},(_,i)=>i+1),savedCodes:[],quizResults:{},streak:7,badges:["First Lesson","First Code","7 Days Streak","10 Tasks","1000 XP"],notifications:["🔔 تم إضافة Task جديد.","🎯 حصلت على Badge جديد.","🔥 حافظت على الـStreak.","📚 تم نشر درس جديد."],teacherItems:[]};
let S={...defaults,...JSON.parse(localStorage.getItem("minaFirebaseCache")||"{}")};
let UID=null;

/* ================= STORAGE ================= */
function cache(){localStorage.setItem("minaFirebaseCache",JSON.stringify(S))}
function toast(x){const e=document.createElement("div");e.className="toast";e.textContent=x;$("#toastbox").append(e);setTimeout(()=>e.remove(),2600)}
function $(s){return document.querySelector(s)}
function esc(x){return String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function pct(){return Math.round(S.completedLessons.length/40*100)}
async function sync(){
 cache();
 if(!UID)return;
 try{await set(ref(db,"students/"+UID),{...S,updatedAt:Date.now(),uid:UID})}
 catch(e){console.warn("Firebase sync:",e);toast("⚠️ تعذر المزامنة — تم الحفظ محليًا")}
}
async function loadRemote(){
 if(!UID)return;
 try{
  const snap=await get(ref(db,"students/"+UID));
  if(snap.exists())S={...S,...snap.val()};
  cache();render();
  onValue(ref(db,"students/"+UID),snap=>{if(snap.exists()){S={...S,...snap.val()};cache();render(false)}})
 }catch(e){console.warn(e)}
}
function addXP(n){S.xp+=n;S.level=Math.min(5,Math.floor(S.xp/300)+1);sync();toast("🎉 +"+n+" XP")}
function nav(x){location.hash="#"+x}
function route(){return location.hash.slice(1)||"dashboard"}
function codeBlock(c){return `<div class="code"><div class="codehead"><span>JavaScript</span><button class="btn secondary" style="padding:5px 9px" onclick='copyCode(${JSON.stringify(c)})'>Copy</button></div><pre>${esc(c)}</pre></div>`}
function copyCode(c){navigator.clipboard?.writeText(c);toast("✓ تم نسخ الكود")}
function openModal(h){$("#modalbody").innerHTML=h;$("#modal").classList.add("show")}
function closeModal(){$("#modal").classList.remove("show")}

/* ================= AUTH ================= */
onAuthStateChanged(auth,async user=>{
 if(user){UID=user.uid;await loadRemote();return}
 try{await signInAnonymously(auth)}catch(e){console.error(e);toast("⚠️ فشل تسجيل الدخول إلى Firebase")}
});

/* ================= ROUTER ================= */
function render(){
 const p=route().split("/"),v=p[0];
 let c=v==="dashboard"?dashboard():v==="courses"?courses():v==="course"?course(+p[1]||1):v==="lesson"?lesson(+p[1]||1):v==="tasks"?tasks():v==="task"?task(+p[1]||1):v==="quiz"?quiz(+p[1]||1):v==="code-lab"?codeLab():v==="achievements"?achievements():v==="leaderboard"?leaderboard():v==="profile"?profile():v==="teacher"?teacher():v==="content"?content():dashboard();
 $("#app").innerHTML=layout(c,v);bindSearch()
}
function navs(v,bottom=false){
 const a=[["dashboard","⌂","الرئيسية"],["courses","▣","الكورسات"],["tasks","✓","المهام"],["quiz/1","?","الاختبارات"],["code-lab","</>","Code Lab"],["achievements","★","الإنجازات"],["profile","●","الملف"]];
 return a.map(x=>`<button class="nav ${v===x[0].split("/")[0]?"active":""}" onclick="nav('${x[0]}')">${bottom?`<b>${x[1]}</b>${x[2]}`:`${x[1]} ${x[2]}`}</button>`).join("")
}
function layout(c,v){return `<header class="top"><div class="brand"><b>&lt;/&gt; MINA CODE</b><small>ACADEMY</small></div><div class="search"><span>⌕</span><input id="search" placeholder="ابحث في المحتوى..."><div id="results" class="results"></div></div><div class="actions"><button class="icon" onclick="toggleTheme()">☀️</button><button class="icon" onclick="toggleNotifications()">🔔</button><button class="avatar" onclick="nav('profile')">${esc(S.studentName[0])}</button></div></header><div class="layout"><aside class="side">${navs(v)}<hr style="border-color:var(--line)"><button class="nav" onclick="nav('teacher')">👨‍🏫 Teacher Mode</button><button class="nav" onclick="changeName()">✏️ تغيير الاسم</button><button class="nav" onclick="resetLocal()">♻️ Reset Local</button></aside><main class="main"><div class="page">${c}</div></main></div><nav class="bottom">${navs(v,true)}</nav>`}

/* ================= DASHBOARD ================= */
function stat(i,l,x){return `<div class="card stat"><div>${i}</div><div class="label">${l}</div><div class="value">${x}</div></div>`}
function dashboard(){return `<section class="hero"><div><div class="eyebrow">MINA CODE ACADEMY</div><h1>أهلاً يا ${esc(S.studentName)} 👋</h1><p class="muted">جاهز تكمل رحلة تعلم البرمجة؟</p><button class="btn" onclick="nav('lesson/${Math.min(30,S.completedLessons.length+1)}')">▶ أكمل التعلم</button></div><div style="min-width:220px;align-self:center"><div class="sectionhead"><b>تقدمك</b><b>${pct()}%</b></div><div class="progress"><i style="width:${pct()}%"></i></div></div></section><div class="grid stats">${stat("⚡","XP",S.xp.toLocaleString())}${stat("◈","Level","Level "+S.level)}${stat("✓","Tasks",S.completedTasks.length+" / 25")}${stat("📚","Lessons",S.completedLessons.length+" / 40")}${stat("🔥","Streak",S.streak+" أيام")}</div><section class="section"><div class="sectionhead"><h2>Continue Learning</h2><button class="btn secondary" onclick="nav('courses')">كل الكورسات</button></div><div class="card"><b>💻 أساسيات البرمجة</b><p class="muted">آخر درس: Loops</p><div class="progress"><i style="width:${pct()}%"></i></div><div style="margin-top:13px"><button class="btn" onclick="nav('lesson/${Math.min(30,S.completedLessons.length+1)}')">متابعة الدرس</button></div></div></section><section class="section"><div class="sectionhead"><h2>الكورسات</h2></div><div class="grid coursegrid">${courses.map(courseCard).join("")}</div></section>`}
function courseCard(c){return `<div class="card course"><div class="courseicon">${c.icon}</div><h3>${c.name}</h3><p>${c.desc}</p><div class="tags"><span class="tag">${c.difficulty}</span><span class="tag">10 Lessons</span><span class="tag">Tasks</span></div><div class="sectionhead"><span class="muted">Progress</span><b>${c.id===1?pct():c.id===2?34:12}%</b></div><div class="progress"><i style="width:${c.id===1?pct():c.id===2?34:12}%"></i></div><button class="btn" style="margin-top:13px" onclick="nav('course/${c.id}')">فتح الكورس</button></div>`}
function courses(){return `<div class="sectionhead"><div><h1>الكورسات</h1><p class="muted">اختار مسارك وابدأ التطبيق.</p></div></div><div class="grid coursegrid">${courses.map(courseCard).join("")}</div>`}

/* ================= COURSE / LESSON ================= */
function course(id){const c=courses.find(x=>x.id===id)||courses[0],ls=lessons.filter(x=>x.course===id);return `<div class="hero"><div><div class="eyebrow">${c.difficulty}</div><h1>${c.icon} ${c.name}</h1><p class="muted">${c.desc}</p></div><div style="min-width:210px;align-self:center"><b>${c.id===1?pct():34}% Complete</b><div class="progress" style="margin-top:10px"><i style="width:${c.id===1?pct():34}%"></i></div></div></div><div class="card section"><h2>Course Curriculum</h2><div class="list">${ls.map(l=>{let st=S.completedLessons.includes(l.id)?"done":l.id===S.completedLessons.length+1?"current":"locked";return `<div class="row ${st}" onclick="${st==="locked"?"toast('🔒 أكمل الدروس السابقة أولًا')":`nav('lesson/${l.id}')`}"><div class="num">${st==="done"?"✓":l.id}</div><div class="grow"><b>${l.title}</b><div class="muted">${l.duration} دقيقة</div></div><span class="pill ${st==="done"?"ok":st==="current"?"warn":""}">${st==="done"?"Completed":st==="current"?"Current":"Locked"}</span></div>`}).join("")}</div></div>`}
function lesson(id){const l=lessons.find(x=>x.id===id)||lessons[0],done=S.completedLessons.includes(id);return `<div class="lessonlayout"><aside class="card sticky"><b>أساسيات البرمجة</b><div class="progress" style="margin:12px 0"><i style="width:${pct()}%"></i></div>${lessons.slice(Math.max(0,id-3),Math.min(30,id+2)).map(x=>`<button class="nav ${x.id===id?"active":""}" onclick="nav('lesson/${x.id}')">${x.id}. ${x.title}</button>`).join("")}</aside><article class="card"><div class="eyebrow">LESSON ${String(l.id).padStart(2,"0")}</div><h1>${l.title}</h1><p class="muted">${l.duration} دقيقة</p><div class="video"><div class="play">▶</div></div><h2>شرح الدرس</h2><p style="line-height:2">في الدرس ده هنتعلم الفكرة الأساسية بطريقة عملية، وبعدها هنشوف مثال ونطبقه في Code Lab.</p><h2>Code Example</h2>${codeBlock(l.code)}<button class="btn secondary" onclick='openLab(${JSON.stringify(l.code)})'>▶ Try Code</button><button class="btn secondary" style="margin-right:7px" onclick='saveCode(${JSON.stringify(l.code)})'>⭐ Save</button><div class="card" style="margin-top:18px"><h3>🎯 Task</h3><p class="muted">جرب كتابة كود يطبع اسمك.</p><button class="btn" onclick="nav('task/${l.id}')">ابدأ المهمة</button></div><div style="margin-top:18px">${done?'<span class="pill ok">✓ الدرس مكتمل</span>':`<button class="btn ok" onclick="completeLesson(${id})">✓ إكمال الدرس +10 XP</button>`}</div></article></div>`}
async function completeLesson(id){if(S.completedLessons.includes(id))return toast("الدرس مكتمل بالفعل");S.completedLessons.push(id);if(!S.badges.includes("First Lesson"))S.badges.push("First Lesson");addXP(10);await sync();render()}
function saveCode(c){if(!S.savedCodes.includes(c)){S.savedCodes.push(c);sync();toast("✓ تم حفظ الكود")}else toast("الكود محفوظ بالفعل")}
function openLab(c){nav("code-lab");setTimeout(()=>{$("#editor").value=c},100)}

/* ================= TASKS ================= */
function tasks(){return `<div class="sectionhead"><div><h1>المهام 🎯</h1><p class="muted">طبق اللي اتعلمته.</p></div></div><div class="list">${tasks.map(t=>`<div class="card row"><div class="num">#${String(t.id).padStart(3,"0")}</div><div class="grow"><b>${t.title}</b><p class="muted">${t.desc}</p><span class="pill ${t.difficulty==="Easy"?"ok":t.difficulty==="Hard"?"bad":"warn"}">${t.difficulty}</span> <span class="pill">+${t.xp} XP</span></div><span class="pill ${S.completedTasks.includes(t.id)?"ok":""}">${S.completedTasks.includes(t.id)?"Completed":"Pending"}</span><button class="btn" onclick="nav('task/${t.id}')">ابدأ</button></div>`).join("")}</div>`}
function task(id){const t=tasks.find(x=>x.id===id)||tasks[0];return `<div class="card"><div class="eyebrow">TASK #${String(t.id).padStart(3,"0")}</div><h1>${t.title}</h1><div class="tags"><span class="pill">${t.difficulty}</span><span class="pill">+${t.xp} XP</span></div><p class="muted">${t.desc}</p><div class="card"><b>Input:</b> 2, 3<br><b>Output:</b> 5</div><h3>Code Editor</h3><textarea class="editor" id="taskEditor">${esc(t.starter)}</textarea><div style="margin:10px 0;display:flex;gap:8px"><button class="btn" onclick="runSandbox('taskEditor','taskOutput')">▶ Run</button><button class="btn secondary" onclick="submitTask(${id})">Submit</button></div><div class="output" id="taskOutput">اضغط Run...</div></div>`}
async function submitTask(id){const t=tasks.find(x=>x.id===id);if(!S.completedTasks.includes(id)){S.completedTasks.push(id);if(S.completedTasks.length>=10&&!S.badges.includes("10 Tasks"))S.badges.push("10 Tasks");addXP(t.xp);await sync()}toast("✓ تم تسجيل المهمة");render()}

/* ================= QUIZ ================= */
function quiz(id){const q=quizzes.find(x=>x.id===id)||quizzes[0],ans=S.quizResults?.[id];return `<div class="card"><div class="eyebrow">QUIZ #${String(id).padStart(2,"0")}</div><h1>${q.question}</h1>${codeBlock(q.code)}<div class="list">${q.options.map((o,i)=>`<button class="card" onclick="answerQuiz(${id},${i})">${String.fromCharCode(65+i)}. ${o}</button>`).join("")}</div>${ans!==undefined?`<div class="card section"><b>${ans?"✓ Correct":"✗ Wrong"}</b><p class="muted">${q.explanation}</p></div>`:""}<div class="sectionhead section"><button class="btn secondary" onclick="nav('quiz/${Math.max(1,id-1)}')">السابق</button><button class="btn" onclick="nav('quiz/${Math.min(30,id+1)}')">التالي</button></div></div>`}
async function answerQuiz(id,i){if(S.quizResults[id]!==undefined)return toast("تمت الإجابة قبل كده");const q=quizzes.find(x=>x.id===id),ok=i===q.correct;S.quizResults[id]=ok;addXP(ok?20:0);await sync();toast(ok?"✓ إجابة صحيحة +20 XP":"❌ إجابة غير صحيحة");render()}

/* ================= CODE LAB ================= */
function codeLab(){return `<div class="sectionhead"><div><h1>Code Lab ⚡</h1><p class="muted">JavaScript Sandbox محلي داخل المتصفح.</p></div><span class="pill">Firebase Ready</span></div><div class="card"><textarea class="editor" id="editor">const name = "Mina";\nconsole.log(name);</textarea><div style="display:flex;gap:8px;margin:12px 0"><button class="btn" onclick="runSandbox('editor','output')">▶ Run</button><button class="btn secondary" onclick="saveEditor()">💾 Save</button><button class="btn secondary" onclick="$('#editor').value='';$('#output').textContent=''">🧹 Clear</button></div><div class="output" id="output">جاهز...</div><p class="muted" style="font-size:11px">التنفيذ Demo لـJavaScript فقط، ولا يعتمد على Server.</p></div><div class="card section"><h3>⭐ Saved Codes</h3>${S.savedCodes.length?S.savedCodes.map(codeBlock).join(""):'<div class="muted">لا يوجد أكواد محفوظة.</div>'}</div>`}
function runSandbox(editor,out){const code=$("#"+editor).value,o=$("#"+out);try{let logs=[];const c={log:(...a)=>logs.push(a.map(x=>typeof x==="object"?JSON.stringify(x):String(x)).join(" ")),warn:(...a)=>logs.push("⚠ "+a.join(" ")),error:(...a)=>logs.push("❌ "+a.join(" "))};new Function("console","document","localStorage","fetch","XMLHttpRequest",`"use strict";${code}`)(c,undefined,undefined,undefined,undefined);o.textContent=logs.join("\\n")||"✓ تم التنفيذ بدون Output";if(!S.badges.includes("First Code"))S.badges.push("First Code");sync()}catch(e){o.textContent="Error: "+e.message}}
function saveEditor(){saveCode($("#editor").value);if(!S.badges.includes("Code Explorer"))S.badges.push("Code Explorer");sync()}

/* ================= ACHIEVEMENTS / PROFILE ================= */
function achievements(){return `<div class="sectionhead"><div><h1>الإنجازات 🏆</h1><p class="muted">اجمع Badges مع تقدمك.</p></div></div><div class="grid badgegrid">${badges.map(b=>{let ok=S.badges.includes(b[1]);return `<div class="card badge ${ok?"":"locked"}"><div class="badgeicon">${b[0]}</div><div><b>${b[1]}</b><div class="muted">${b[2]}</div><span class="pill ${ok?"ok":""}">${ok?"Unlocked":"Locked"}</span></div></div>`}).join("")}</div>`}
function leaderboard(){return `<div class="card"><h1>Leaderboard 🏆</h1><p class="muted">ترتيب Demo.</p><table class="table"><thead><tr><th>#</th><th>Student</th><th>XP</th><th>Level</th><th>Tasks</th></tr></thead><tbody>${[...demoStudents].sort((a,b)=>b[1]-a[1]).map((x,i)=>`<tr><td>${i+1}</td><td>👤 ${x[0]}</td><td>${x[1]}</td><td>${x[2]}</td><td>${x[3]}</td></tr>`).join("")}</tbody></table></div>`}
function profile(){return `<div class="hero"><div><div class="avatar" style="width:70px;height:70px;display:grid;place-items:center">${esc(S.studentName[0])}</div><h1>${esc(S.studentName)}</h1><p class="muted">Level ${S.level} • ${S.xp} XP • UID: ${UID?UID.slice(0,8)+"…":"Offline"}</p></div><div style="min-width:210px;align-self:center"><b>Progress</b><div class="progress" style="margin-top:10px"><i style="width:${pct()}%"></i></div></div></div><div class="grid stats">${stat("🏆","Badges",S.badges.length)}${stat("📚","Courses",3)}${stat("✓","Tasks",S.completedTasks.length)}${stat("📖","Lessons",S.completedLessons.length)}${stat("🔥","Streak",S.streak)}</div>`}

/* ================= TEACHER ================= */
function teacher(){return `<div class="sectionhead"><div><h1>Teacher Dashboard 👨‍🏫</h1><p class="muted">واجهة تجريبية. صلاحيات المدرس الحقيقية تحتاج Rules/Backend.</p></div><button class="btn" onclick="nav('content')">Content Manager</button></div><div class="grid stats">${stat("👥","Students","128")}${stat("📚","Courses","3")}${stat("📖","Lessons","30")}${stat("🎯","Tasks","20")}${stat("📈","Avg Progress","67%")}</div><div class="grid" style="grid-template-columns:2fr 1fr"><div class="card"><h2>Activity</h2><div class="chart">${[55,72,42,88,64,93,75].map(x=>`<div class="bar" style="height:${x}%"></div>`).join("")}</div></div><div class="card"><h2>Submissions</h2><div class="list">${["Mina • Task #18","Ahmed • Quiz #7","Gamal • Task #12","Sara • Quiz #3"].map(x=>`<div class="row">${x}<span class="pill ok">New</span></div>`).join("")}</div></div></div>`}
function content(){return `<div class="sectionhead"><div><h1>Teacher Content Manager</h1><p class="muted">المحتوى المضاف هنا محفوظ في Firebase داخل حسابك.</p></div></div><div class="grid" style="grid-template-columns:repeat(3,1fr)"><button class="card" onclick="contentForm('Lesson')">📖<h3>Add Lesson</h3></button><button class="card" onclick="contentForm('Task')">🎯<h3>Add Task</h3></button><button class="card" onclick="contentForm('Quiz')">❓<h3>Add Quiz</h3></button></div><div class="card section"><h3>Saved Content</h3>${S.teacherItems?.length?S.teacherItems.map(x=>`<div class="row"><b>${esc(x.type)}</b><span class="grow">${esc(x.title)}</span><span class="pill">Firebase</span></div>`).join(""):'<div class="muted">لا يوجد محتوى مضاف.</div>'}</div>`}
function contentForm(type){openModal(`<h2>Add ${type}</h2><div class="formgrid"><div class="field"><label>Title</label><input id="ctitle"></div><div class="field"><label>Difficulty</label><select id="cdiff"><option>Easy</option><option>Medium</option><option>Hard</option></select></div><div class="field" style="grid-column:1/-1"><label>Description / Question</label><textarea id="cdesc"></textarea></div><div class="field" style="grid-column:1/-1"><label>Code / Content</label><textarea id="ccode"></textarea></div></div><button class="btn" style="margin-top:12px" onclick="saveContent('${type}')">Save</button>`)}
async function saveContent(type){const title=$("#ctitle").value.trim();if(!title)return toast("اكتب العنوان");const item={type,title,desc:$("#cdesc").value,code:$("#ccode").value,difficulty:$("#cdiff").value,createdAt:Date.now()};S.teacherItems=S.teacherItems||[];S.teacherItems.push(item);await sync();try{await push(ref(db,"teacherContent/"+UID),item)}catch(e){console.warn(e)}closeModal();render();toast("✓ تم حفظ المحتوى في Firebase")}

/* ================= SEARCH / UI ================= */
function bindSearch(){const i=$("#search");if(!i)return;i.oninput=()=>{const q=i.value.trim().toLowerCase(),box=$("#results");if(!q){box.style.display="none";return}const all=[...courses.map(x=>({t:x.name,r:"course/"+x.id,k:"Course"})),...lessons.map(x=>({t:x.title,r:"lesson/"+x.id,k:"Lesson"})),...tasks.map(x=>({t:x.title,r:"task/"+x.id,k:"Task"}))].filter(x=>x.t.toLowerCase().includes(q)).slice(0,8);box.innerHTML=all.length?all.map(x=>`<div class="result" onclick="nav('${x.r}')"><b>${esc(x.t)}</b> <small class="muted">${x.k}</small></div>`).join(""):'<div class="muted" style="padding:15px">لا توجد نتائج</div>';box.style.display="block"}}
function toggleTheme(){document.body.classList.toggle("light");S.theme=document.body.classList.contains("light")?"light":"dark";sync()}
function toggleNotifications(){toast(S.notifications[0]||"أنت متابع كل جديد 👌")}
function changeName(){const n=prompt("اسم الطالب:",S.studentName);if(n?.trim()){S.studentName=n.trim();sync();render()}}
function resetLocal(){if(confirm("مسح البيانات المحلية وإعادة Demo؟")){localStorage.removeItem("minaFirebaseCache");location.reload()}}

/* ================= INIT ================= */
if(S.theme==="light")document.body.classList.add("light");
window.addEventListener("hashchange",render);
window.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
if(!location.hash)location.hash="#dashboard";render();
</script>
</body>
</html>
